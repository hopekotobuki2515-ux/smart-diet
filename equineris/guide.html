<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="SMART Diet食事記録の記入見本。写真、メモ、4群の○チェックの入力方法を確認できます。">
<title>食事記録の見本 | SMART Diet</title>
<style>

:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color-scheme:light;--ink:#24443c;--green:#285d4a;--mint:#ecf5ed;--line:#cbd7cd;--muted:#60776a}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;min-width:280px;overflow-x:hidden;background:#fff;color:var(--ink)}
input,button,textarea{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #e5a748;outline-offset:2px}
[hidden]{display:none!important}
.viewport{width:100%;min-height:100svh;margin:0;padding:0}
.page{width:100%;max-width:100%;min-height:100svh;margin:0 auto;padding:8px 8px max(24px,env(safe-area-inset-bottom));background:#fff}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 0 8px;border-bottom:1px solid #dbe4dc}
.back{min-height:36px;display:flex;align-items:center;color:var(--green);font-size:13px;text-decoration:none;font-weight:700;white-space:nowrap}
.toolbar-title{font-size:16px;line-height:1.4;margin:0;font-weight:800}
.date-row{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:12px;font-weight:700;min-width:0}
.date-row input{width:min(150px,40vw);height:40px;border:1px solid #c9d8cc;border-radius:9px;background:#fff;padding:5px;font-size:15px;color:var(--ink)}
.card{padding:0;margin:0;border:0;background:#fff;box-shadow:none}
#dayTitle,.explanation,#dateHelp{display:none!important}
.photo-area{margin:8px 0 0;min-width:0}
.photo-pane{min-width:0}
.photo-choose{display:flex;align-items:center;justify-content:center;position:relative;width:100%;min-height:190px;aspect-ratio:4/3;background:#f0f6f0;border:1px dashed #a0baa5;border-radius:12px;color:var(--green);font-size:16px;font-weight:750;overflow:hidden}
.photo-choose:before{content:"＋";font-size:31px;margin-right:8px;font-weight:400}
.photo-choose input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-choose:focus-within{outline:3px solid #d7b271;outline-offset:2px}
.photo-choose input:disabled{cursor:wait}
.photo-view{width:100%;text-align:center}
.photo-view img{display:block;width:100%;height:auto;max-height:min(49svh,470px);object-fit:contain;border-radius:10px;background:#f2f7f1;margin:0 auto}
.photo-remove{min-height:36px;margin:7px 0;padding:6px 11px;border:1px solid #e0cfcc;border-radius:9px;background:#fff;color:#8b3a38;font-size:12px}
.photo-pane:has(.photo-view:not([hidden])) .photo-choose{aspect-ratio:auto;min-height:44px;font-size:13px;background:#fff;border-style:solid}
.photo-pane:has(.photo-view:not([hidden])) .photo-choose:before{font-size:17px}
.memo-area{margin:10px 0 8px}
.memo-label{display:block;font-size:13px;font-weight:750;margin:0 0 5px}
.meal-memo{display:block;width:100%;min-height:84px;resize:vertical;border:1px solid #a8beb0;border-radius:10px;background:#fff;padding:10px 12px;color:var(--ink);font-size:16px;line-height:1.55;writing-mode:horizontal-tb;word-break:normal;overflow-wrap:break-word}
.switch-header{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px}
.switch-header strong{font-size:14px}
.switch-header span{font-size:12px;color:var(--muted)}
.meal-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:0 0 9px}
.meal-tab{min-width:0;min-height:46px;padding:6px 2px;border:1px solid #cbdacc;border-radius:10px;background:#f3f7f1;color:var(--ink);font-size:14px;font-weight:750}
.meal-tab[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.meal-track{display:flex;align-items:stretch;width:100%;min-width:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.meal-track::-webkit-scrollbar{display:none}
.meal-slide{flex:0 0 100%;width:100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding:1px;writing-mode:horizontal-tb}
.slide-heading{font-size:14px;line-height:1.4;margin:1px 0 6px}
.diary-table{width:100%;table-layout:fixed;border-collapse:collapse;background:#fff}
.diary-table th,.diary-table td{border:1px solid var(--line);text-align:center}
.diary-table th{font-size:12px;background:var(--mint);min-height:35px;padding:7px 2px;white-space:normal;line-height:1.4;word-break:normal;overflow-wrap:break-word}.diary-table th small{display:block;font-size:10px;line-height:1.35;font-weight:500;margin-top:4px;color:#426454}
.diary-table td{width:25%;vertical-align:top}
.diary-table .mark{display:grid;place-items:center;min-height:36px;position:relative;cursor:pointer}
.diary-table .mark+.mark{border-top:1px dotted #d8e1d8}
.mark input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.mark span{display:block;width:20px;height:20px;border:1px solid #829b8a;border-radius:50%;background:#fff}
.mark input:checked+span{border:3px solid var(--green);background:#dcf2df;box-shadow:inset 0 0 0 5px white}
.mark input:focus-visible+span{outline:3px solid #dfb65b;outline-offset:2px}
.meal-controls{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:10px 0 4px}
.meal-controls button{min-height:40px;min-width:75px;border:1px solid #c6d7ca;border-radius:9px;color:var(--green);background:#f5faf4;font-size:13px;font-weight:750}
.meal-controls span{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 0}
.action-button{min-height:48px;min-width:0;border-radius:11px;border:1px solid var(--green);background:var(--green);color:#fff;font-weight:800;font-size:15px}
.action-button.outline{background:#fff;color:var(--green)}
.status{margin:6px 0;min-height:0;font-size:12px;line-height:1.6;color:var(--green)}
.status[data-error="true"]{color:#a32f2d}
.status:not([data-error="true"]){font-size:11px}
.sub-nav{margin:8px 0 0}
.sub-nav summary{font-size:12px;min-height:38px;color:var(--muted);cursor:pointer;padding:10px 2px}
.sub-nav a{display:block;padding:12px 6px;border-top:1px solid #e4ece3;text-decoration:none;color:var(--green);font-size:13px}
dialog{width:min(98vw,550px);max-height:88dvh;overflow:auto;border:1px solid #cbd9cc;border-radius:14px;padding:12px;background:white;color:var(--ink)}
dialog::backdrop{background:#0e2a204d}
dialog h2{font-size:17px;margin:0 0 8px}.dialog-date{font-size:12px;color:var(--muted)}
.preview-layout{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}
.preview-layout th,.preview-layout td{border:1px solid var(--line);text-align:center;vertical-align:top;padding:5px 2px;overflow-wrap:break-word}
.preview-layout th{background:var(--mint)}
.preview-layout td:first-child{text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.preview-layout td.circle{font-size:18px;white-space:pre-line;line-height:1.4}
.preview-layout img{display:block;width:100%;height:auto;max-height:140px;object-fit:contain}
.preview-memo{white-space:pre-wrap;overflow-wrap:break-word}
.close{width:100%;min-height:45px;margin-top:12px;border:0;border-radius:9px;background:var(--green);color:#fff}
@media(max-width:350px){.page{padding-inline:5px}.toolbar-title{font-size:14px}.date-row input{width:133px}.meal-tab{font-size:13px}}


/* record.htmlと同一の表示幅・余白・群分け表を使用。見本だけ読み取り専用。 */
.sample-heading{font-size:17px;font-weight:800;line-height:1.5;margin:12px 0 10px}
.sample-photo{display:flex;align-items:center;justify-content:center;width:100%;border:1px solid #dce6dd;border-radius:12px;overflow:hidden;background:#f0f6f0}
.sample-photo svg{display:block;width:100%;height:auto;max-height:320px}
.sample-on span{border:3px solid var(--green);background:#dcf2df;box-shadow:inset 0 0 0 5px white}
.sample-caption{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.sample-start{display:flex;align-items:center;justify-content:center;margin:16px 0 0;text-decoration:none;border-radius:11px;min-height:52px;background:var(--green);color:#fff;font-weight:800;font-size:16px}

</style>
</head>
<body>
<main class="viewport"><div class="page">
<header class="toolbar">
<a class="back" href="./setup.html">〈 戻る</a>
<h1 class="toolbar-title">食事記録の見本</h1>
<span style="font-size:12px;color:var(--muted)">見本</span>
</header>
<section class="card" aria-labelledby="sample-heading">
<h2 class="sample-heading" id="sample-heading">朝食の記入例</h2>
<div class="photo-area">
 <div class="sample-photo"><svg viewBox="0 0 480 258" role="img" aria-label="食パン、ゆで卵、ヨーグルトを載せた朝食のイメージ" xmlns="http://www.w3.org/2000/svg">

</div>
<div class="memo-area">
<label class="memo-label" for="sampleMemo">朝食のメモ</label>
<textarea class="meal-memo" id="sampleMemo" rows="2" readonly>食パン1枚、ゆで卵1個、ヨーグルト1個</textarea>
</div>
<div class="switch-header"><strong>朝食</strong><span>第1〜4群を確認</span></div>
<h3 class="slide-heading">朝食の群分けチェック</h3>
<table class="diary-table food-groups" aria-label="朝食の食品群チェック完成見本">
<thead><tr><th scope="col">第1群<small>乳・乳製品／卵</small></th><th scope="col">第2群<small>魚・肉／豆製品</small></th><th scope="col">第3群<small>野菜・きのこ／いも・果物</small></th><th scope="col">第4群<small>米・パン・麺／油脂・調味料・酒</small></th></tr></thead>
<tbody><tr><td><div class="mark sample-on" aria-label="○"><span aria-hidden="true"></span></div><div class="mark sample-on" aria-label="○"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div></td><td><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div></td><td><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div></td><td><div class="mark sample-on" aria-label="○"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div><div class="mark " aria-label="未チェック"><span aria-hidden="true"></span></div></td></tr></tbody></table>
<p class="sample-caption">卵とヨーグルトは第1群に2個、食パンは第4群に1個の○を付けます。写真はイラストによる見本です。</p>

</section>
</div></main>
</body></html>
