<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fefdf8">
  <meta name="description" content="EQUINERISの初回設定。基本情報を入力し、BMIと12週間後の目標体重を確認します。">
  <title>登録 | EQUINERIS</title>
  <style>
    :root {
      color-scheme:light;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      --ink:#183e38;--ink-light:#31564d;--muted:#667a6d;
      --gold:#a6844e;--gold-light:#d7c5a3;--green:#285d4a;
      --cream:#f8f7f1;--outline:#e7e5d9;
    }
    *,*::before,*::after {box-sizing:border-box}
    html {overflow-x:hidden;-webkit-text-size-adjust:100%}
    body {margin:0;min-width:280px;background:#e8eee8;color:var(--ink);overflow-x:hidden}
    button,input,a {font:inherit;touch-action:manipulation}
    button {cursor:pointer}
    :focus-visible {outline:3px solid var(--gold);outline-offset:3px}
    .viewport {min-height:100svh;display:flex;justify-content:center}
    .page {
      width:100%;max-width:510px;min-height:100svh;
      padding:23px 20px max(33px,env(safe-area-inset-bottom));
      background:linear-gradient(157deg,#fefdf8 0%,#fbfbf6 48%,#f0f5ef 100%);
      box-shadow:0 18px 70px rgba(25,54,41,.055);
    }
    .topbar {display:flex;justify-content:space-between;align-items:center;gap:12px}
    .back {display:inline-flex;align-items:center;min-height:44px;color:var(--ink-light);text-decoration:none;font-size:13px;font-weight:650}
    .step {font-size:10px;letter-spacing:.19em;color:var(--gold);font-weight:800}
    .wordmark {text-align:center;margin:12px 0 0;font-size:27px;letter-spacing:.11em;font-weight:800;line-height:1.15}
    .wordmark span {color:var(--gold)}
    .eyebrow {text-align:center;margin:30px 0 9px;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.2em}
    h1 {text-align:center;font-size:clamp(23px,6.2vw,29px);line-height:1.48;letter-spacing:.025em;margin:0}
    .lead {margin:12px auto 26px;text-align:center;font-size:13px;line-height:1.8;color:var(--ink-light);max-width:350px}
    .card {
      padding:22px 18px;background:#fffdfa;border:1px solid var(--outline);
      border-radius:20px;box-shadow:0 8px 24px rgba(21,67,45,.035);
    }
    .sectionhead {margin:0 0 22px}
    .sectionhead h2 {font-size:17px;line-height:1.4;margin:0 0 4px}
    .sectionhead p {font-size:12px;color:var(--muted);line-height:1.65;margin:0}
    .field {display:block;margin:0 0 20px}
    .field:last-child {margin-bottom:0}
    .field-label {display:block;font-size:14px;line-height:1.5;font-weight:750;margin:0 0 8px}
    .hint {font-size:11px;font-weight:500;color:var(--muted)}
    .field input {
      width:100%;min-width:0;min-height:52px;border:1px solid #d9e2d9;border-radius:12px;
      background:#fff;color:var(--ink);padding:12px 15px;font-size:17px;
      appearance:textfield;
    }
    .field input:focus {outline:2px solid #9fbea9;outline-offset:1px;border-color:#56836b}
    input::placeholder {color:#9ca79e;opacity:1}
    input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button {-webkit-appearance:none;margin:0}
    .unitwrap {position:relative}
    .unitwrap input {padding-right:54px}
    .unit {position:absolute;right:17px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
    .history-card {margin-top:0}
    .goal-card {margin-top:0}
    .slide-track {
      display:flex;align-items:flex-start;width:100%;overflow-x:auto;overflow-y:hidden;
      scroll-snap-type:x mandatory;overscroll-behavior-inline:contain;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    .slide-track::-webkit-scrollbar {display:none}
    .slide-track > .slide {flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
    .swipe-status {display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 2px 7px;font-size:12px;color:var(--muted)}
    .swipe-status strong {color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
    .swipe-dots {display:flex;justify-content:center;align-items:center;gap:6px;margin:0 0 10px}
    .swipe-dot {min-width:44px;min-height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
    .swipe-dot::before {content:"";width:7px;height:7px;border-radius:50%;background:#cdd9ce;transition:width .2s,background .2s}
    .swipe-dot[aria-current="step"]::before {width:26px;border-radius:8px;background:var(--green)}
    .slide-actions {display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
    .slide-actions .next {flex:1 1 180px;width:auto}
    .slide-prev {flex:0 0 84px;min-height:56px;border:1px solid #b7cbbd;border-radius:15px;background:#fffdfa;color:var(--ink-light);font-weight:700}
    .slide-actions .after {flex:1 1 100%;margin-top:5px}
    [hidden] {display:none!important}
    fieldset {border:0;padding:0;margin:0;min-width:0}
    legend {padding:0 0 5px;font-size:17px;font-weight:780;line-height:1.45}
    .goal-desc {color:var(--muted);font-size:12px;line-height:1.65;margin:0 0 16px}
    .options {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
    .option {position:relative}
    .option input {position:absolute;opacity:0;width:1px;height:1px;left:50%;top:50%}
    .option label {
      display:flex;align-items:center;justify-content:center;min-width:0;min-height:52px;
      font-size:17px;font-weight:800;border:1px solid #d8e3d8;background:#fff;
      color:var(--ink-light);border-radius:12px;cursor:pointer;
    }
    .option input:checked+label {background:#285d4a;border-color:#285d4a;color:#fff}
    .option input:focus-visible+label {outline:3px solid var(--gold);outline-offset:3px}
    .goal-note {font-size:11px;color:var(--muted);line-height:1.75;margin:15px 0 0}
    .metric-inline {margin:-5px 0 17px;padding:10px 13px;background:#f1f7f1;border:1px solid #dfe7df;border-radius:12px}
    .reference-note {margin:-8px 0 21px}
    .metric {display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid #dfe7df}
    .metric-label {font-size:12px;color:var(--muted)}
    .metric-output {font-size:21px;letter-spacing:.015em;font-weight:780;color:var(--ink)}
    .metric-output small {font-size:12px;font-weight:600}
    .empty {color:#87998d}
    .note {margin:15px 0 0;font-size:11px;color:#62766a;line-height:1.85}
    .action {margin-top:25px}
    .next {
      width:100%;display:flex;align-items:center;justify-content:center;position:relative;
      min-height:56px;border:1px solid #244f41;border-radius:15px;
      background:linear-gradient(125deg,#285d4a,#143d32);color:#fffdf5;
      font-size:17px;font-weight:800;letter-spacing:.09em;box-shadow:0 11px 24px rgba(24,66,48,.13);
    }
    .arrow {position:absolute;right:20px;font-size:23px;color:#e0c89d;line-height:1}
    .after {text-align:center;font-size:12px;color:var(--muted);line-height:1.9;margin:17px 0 0}
    .preview-link {display:flex;align-items:center;justify-content:center;min-height:48px;margin:0 auto 20px;padding:10px 14px;border:1px solid #d4e0d5;border-radius:12px;background:#f4f8f2;color:var(--ink-light);text-align:center;text-decoration:none;font-size:13px;font-weight:750;max-width:350px}
    dialog {
      width:min(92vw,420px);max-height:90vh;max-height:90dvh;overflow-y:auto;
      border:1px solid #d3e0d6;border-radius:18px;padding:24px;
      background:#fffdf9;color:var(--ink);box-shadow:0 24px 70px rgba(13,49,32,.23);
    }
    dialog::backdrop {background:rgba(12,34,25,.5)}
    dialog h2 {font-size:21px;margin:0 0 12px}
    dialog p {font-size:13px;line-height:1.85;margin:0 0 15px;color:var(--ink-light)}
    .summary {margin:0 0 16px;font-size:13px;line-height:1.9;white-space:pre-line;background:#f5f8f2;border:1px solid #dfe7db;border-radius:12px;padding:14px}
    .close {width:100%;min-height:48px;background:var(--green);color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:750}
    .guide-link {display:flex;align-items:center;justify-content:center;min-height:48px;padding:10px 14px;margin:12px 0;border:1px solid #244f41;border-radius:12px;background:linear-gradient(125deg,#285d4a,#143d32);color:#fffdf5;text-align:center;text-decoration:none;font-size:15px;font-weight:750}
    .unsaved-note {font-size:11px;line-height:1.7;color:var(--muted);margin:0 0 12px}
    @media(max-width:340px) {
      .page {padding-inline:13px}
      .card {padding:20px 14px}
      .options {gap:5px}
      .option label {font-size:16px;min-height:50px}
    }
    @media(min-width:650px) {
      .viewport {padding:24px}
      .page {border:1px solid var(--outline);border-radius:25px;min-height:calc(100svh - 48px);padding-inline:34px}
    }
  </style>
</head>
<body>
<main class="viewport">
  <div class="page">
    <div class="topbar">
      <a class="back" href="./smart-diet.html" aria-label="EQUINERISの説明に戻る">〈 戻る</a>
      <span class="step">REGISTRATION</span>
    </div>
    <p class="wordmark" aria-label="EQUINERIS">EQUI<span>NERIS</span></p>
    <p class="eyebrow">YOUR FIRST STEP</p>
    <h1>はじめに登録しましょう</h1>
    <p class="lead">お名前はニックネームでも大丈夫です。<br>身長と現在の体重を入力してください。</p>
    <form id="setupForm" autocomplete="on">
      <section class="card" aria-labelledby="basic-title">
        <div class="sectionhead">
          <h2 id="basic-title">基本情報</h2>
          <p>入力するのは、次の3項目だけです。</p>
        </div>
        <label class="field">
          <span class="field-label">名前 <span class="hint">（ニックネーム可）</span></span>
          <input id="nickname" name="nickname" type="text" maxlength="40" placeholder="名前またはニックネーム" autocomplete="nickname" required>
        </label>
        <label class="field">
          <span class="field-label">身長</span>
          <span class="unitwrap"><input id="height" name="height" type="number" inputmode="decimal" min="0.1" step="0.1" placeholder="身長を入力" required><span class="unit">cm</span></span>
        </label>
        <label class="field">
          <span class="field-label">現在の体重</span>
          <span class="unitwrap"><input id="weight" name="weight" type="number" inputmode="decimal" min="0.1" step="0.1" placeholder="現在の体重を入力" required><span class="unit">kg</span></span>
        </label>
      </section>
      <div class="action">
        <button class="next" type="submit" id="registerButton">登録して次へ <span class="arrow" aria-hidden="true">›</span></button>
        <p class="after">入力内容はこの端末のブラウザ内に保存します。<br>アカウント登録や別端末との同期はまだできません。</p>
        <p class="after" id="registrationStatus" role="status" aria-live="polite" hidden></p>
      </div>
    </form>
  </div>
</main>
<script>
'use strict';
(()=>{
 const form=document.getElementById('setupForm');
 const name=document.getElementById('nickname');
 const height=document.getElementById('height');
 const weight=document.getElementById('weight');
 const status=document.getElementById('registrationStatus');
 const KEY='equineris:registration:v1';
 function showError(message){status.textContent=message;status.hidden=false;}
 try{
  const saved=JSON.parse(localStorage.getItem(KEY)||'null');
  if(saved&&typeof saved==='object'){
   if(typeof saved.name==='string')name.value=saved.name;
   if(typeof saved.heightCm==='string')height.value=saved.heightCm;
   if(typeof saved.weightKg==='string')weight.value=saved.weightKg;
  }
 }catch(error){showError('前回の入力内容を読み込めませんでした。');}
 form.addEventListener('submit',event=>{
  event.preventDefault();
  const enteredName=name.value.trim();
  const h=Number(height.value),w=Number(weight.value);
  if(!enteredName){name.value='';name.focus();return;}
  if(!form.reportValidity())return;
  if(!Number.isFinite(h)||h<=0||!Number.isFinite(w)||w<=0){
   showError('身長と体重は0より大きい数値を入力してください。');return;
  }
  try{
   localStorage.setItem(KEY,JSON.stringify({name:enteredName,heightCm:height.value,weightKg:weight.value}));
  }catch(error){
   showError('入力内容を保存できませんでした。ブラウザの保存設定を確認してください。');return;
  }
  window.location.assign('./record.html');
 });
})();
</script>
</body>
</html>
