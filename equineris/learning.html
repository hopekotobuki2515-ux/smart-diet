<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fefdf8">
<meta name="description" content="SMART Dietの12週間の学び。週ごとに今週のお話・学習・実践・振り返りを横スワイプで読むことができます。">
<title>SMART Diet｜12週間の学び | EQUINERIS</title>
<style>
    :root {
      color-scheme:light;
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
      --ink:#183e38;--ink-light:#31564d;--muted:#64776a;
      --gold:#a6844e;--gold-light:#d7c5a3;--green:#285d4a;
      --outline:#e7e5d9;--cream:#fefdf8;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%;overflow-x:hidden}
    body{margin:0;min-width:280px;overflow-x:hidden;color:var(--ink);background:#e8eee8}
    button,a{font:inherit;touch-action:manipulation}
    button{cursor:pointer}
    :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    .viewport{min-height:100svh;display:flex;justify-content:center}
    .page{
      width:100%;max-width:510px;min-height:100svh;
      padding:22px 20px max(36px,env(safe-area-inset-bottom));
      background:linear-gradient(157deg,#fefdf8 0%,#fafaf6 46%,#f0f5ef 100%);
      box-shadow:0 18px 70px rgba(25,54,41,.055);
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .back{min-height:44px;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink-light);font-size:13px;font-weight:650}
    .step{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--gold)}
    .wordmark{text-align:center;margin:12px 0 0;font-weight:800;font-size:27px;letter-spacing:.11em;line-height:1.15}
    .wordmark span{color:var(--gold)}
    .heading{text-align:center;margin:35px 0 23px}
    .eyebrow{margin:0 0 11px;color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.21em}
    h1{margin:0;font-size:clamp(25px,6.3vw,30px);line-height:1.5;letter-spacing:.015em}
    .heading>p:last-child{margin:13px auto 0;max-width:360px;color:var(--ink-light);font-size:13px;line-height:1.85}
    .keep-phrase{white-space:nowrap}
    .feature{
      position:relative;isolation:isolate;overflow:hidden;
      border-radius:21px;border:1px solid #d9e4d9;
      background:linear-gradient(135deg,#f4f8f2,#fffdf9);
      padding:21px 18px 18px;text-align:center;
    }
    .feature:before{
      content:"";position:absolute;z-index:-1;top:-95px;right:-98px;
      width:220px;height:220px;border-radius:50%;
      background:radial-gradient(circle,#e4eee2 0%,transparent 72%);
    }
    .rings{position:relative;width:130px;height:130px;margin:0 auto 15px;display:grid;place-items:center}
    .rings:before,.rings:after{content:"";position:absolute;border-radius:50%}
    .rings:before{inset:2px;border:1px solid #a9c0ad}
    .rings:after{inset:15px -5px;border:1px solid #ccb48c;transform:rotate(-28deg)}
    .rings-inner{
      width:85px;height:85px;display:flex;flex-direction:column;justify-content:center;
      align-items:center;border-radius:50%;background:#fffefa;border:1px solid #d9e5d8;
      box-shadow:0 5px 20px rgba(30,75,45,.08);
    }
    .rings-num{font-size:34px;line-height:1;font-weight:780;color:var(--green);letter-spacing:-.035em}
    .rings-unit{margin-top:6px;font-size:10px;font-weight:750;color:var(--gold);letter-spacing:.15em}
    .feature h2{margin:0;font-size:17px;line-height:1.5}
    .feature p{margin:8px auto 0;max-width:340px;font-size:12px;line-height:1.85;color:var(--ink-light)}
    /* 3 DAYS直下の2つのテキストを、端末幅に依存しない横書き・全幅の段落として固定 */
    .feature > h2,.feature > p{
      display:block;width:100%;max-width:100%;min-width:0;
      writing-mode:horizontal-tb;text-orientation:mixed;
      white-space:normal;word-break:normal;overflow-wrap:break-word;
    }
    .section-label{font-size:11px;color:var(--gold);letter-spacing:.16em;font-weight:800;margin:28px 0 13px}
    .timeline{display:grid;grid-template-columns:minmax(0,1fr);width:100%;min-width:0;gap:12px}
    .tile{
      display:grid;grid-template-columns:42px minmax(0,1fr);align-items:start;gap:12px;width:100%;min-width:0;
      border:1px solid var(--outline);border-radius:17px;background:#fffdfa;
      padding:18px 15px 17px;box-shadow:0 7px 22px rgba(21,67,45,.025);
    }
    .num{
      width:42px;height:42px;display:grid;place-items:center;border-radius:13px;
      border:1px solid #d7e4d7;background:#eef5ee;color:var(--green);
      font-size:13px;letter-spacing:.07em;font-weight:800;
    }
    .tile>div{min-width:0;width:100%;writing-mode:horizontal-tb;word-break:normal;overflow-wrap:break-word}
    .tile h3{margin:1px 0 6px;font-size:15px;line-height:1.55}
    .tile p{margin:0;color:var(--ink-light);font-size:12px;line-height:1.85}
    .mini-notice{
      margin:17px 0 0;padding:14px 16px;border-left:3px solid var(--gold-light);
      background:#f9f8f1;color:var(--ink-light);border-radius:0 11px 11px 0;
      font-size:12px;line-height:1.85;
    }
    .actions{margin-top:26px}
    .main-button{
      display:flex;align-items:center;justify-content:center;position:relative;width:100%;text-decoration:none;
      min-height:57px;padding:13px 41px;border:1px solid #244f41;border-radius:15px;
      background:linear-gradient(125deg,#285d4a,#143d32);color:#fffdf5;
      font-size:17px;font-weight:800;letter-spacing:.04em;
      box-shadow:0 11px 24px rgba(24,66,48,.13);
    }
    .arrow{position:absolute;right:20px;color:#e0c89d;font-size:23px;line-height:1}
    .footnote{text-align:center;color:var(--muted);font-size:11px;line-height:1.85;margin:15px auto 0;max-width:360px}
    dialog{
      width:min(92vw,400px);border:1px solid #d3e0d6;border-radius:18px;padding:24px;
      background:#fffdf9;color:var(--ink);box-shadow:0 24px 70px rgba(13,49,32,.23)
    }
    dialog::backdrop{background:rgba(12,34,25,.5)}
    dialog h2{font-size:20px;margin:0 0 10px}
    dialog p{font-size:13px;line-height:1.9;color:var(--ink-light);margin:0 0 16px}
    .close{min-height:47px;width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:15px;font-weight:750}
    @media(max-width:340px){.page{padding-inline:13px}.tile{padding:15px 12px;grid-template-columns:37px minmax(0,1fr);gap:9px}.num{width:37px;height:37px}}
    @media(min-width:650px){.viewport{padding:24px}.page{border-radius:25px;border:1px solid var(--outline);min-height:calc(100svh - 48px);padding-inline:34px}}
  
/* この点数配分ページに限る、スマホ優先の4枚横スワイプ */
.point-intro{text-align:center;font-size:13px;line-height:1.8;color:var(--ink-light);margin:0 0 15px}
.point-track{display:flex;width:100%;max-width:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;overscroll-behavior-x:contain}
.point-track::-webkit-scrollbar{display:none}
.point-slide{min-width:0;flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:2px 1px 8px}
.point-panel{background:#fffefb;border:1px solid #dee7db;border-radius:20px;padding:20px 16px 21px;min-height:100%;color:var(--ink);overflow-wrap:anywhere;box-shadow:0 7px 20px rgba(28,67,40,.04)}
.point-label{margin:0 0 10px;font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.12em;text-align:center}
.point-panel h2{font-size:22px;line-height:1.55;text-align:center;margin:0 0 14px;color:var(--green)}
.point-panel>p:not(.point-label){font-size:13px;line-height:1.85;color:var(--ink-light);margin:12px 0}
.big-rule{padding:18px 8px;margin:18px 0;background:#f5f9f3;border-radius:17px;text-align:center}
.big-rule strong{font-size:35px;line-height:1.4;color:var(--green);display:block;white-space:nowrap}
.big-rule span{font-size:12px;color:var(--ink-light);display:block;margin-top:6px}
.point-rule{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px}
.point-rule-item{padding:12px 14px;border-radius:13px;background:#f5f9f3}
.point-rule-item b{display:block;color:var(--green);font-size:13px;margin-bottom:4px}
.point-rule-item p{font-size:13px;line-height:1.8;color:var(--ink-light);margin:0}
.point-result{text-align:center;border-radius:14px;background:#f5f9f3;padding:12px;margin-bottom:15px}
.point-result strong{display:block;color:var(--green);font-size:30px;line-height:1.4}
.point-result span{display:block;font-size:12px;color:var(--ink-light)}
.meal-list{display:grid;grid-template-columns:1fr;gap:9px}
.meal-panel{border:1px solid #e5e9e0;background:#fafbf8;border-radius:13px;padding:11px}
.meal-panel h3{margin:0 0 8px;font-size:14px;color:var(--green)}
.meal-panel h3 span{font-size:12px;color:var(--ink-light);font-weight:500}
.groups-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.groups-summary span{text-align:center;font-size:12px;line-height:1.5;min-width:0;padding:6px 2px;background:#fff;border-radius:7px;border:1px solid #ecede7;color:var(--ink-light)}
.groups-summary b{display:block;font-size:13px;color:var(--green)}
.point-panel .panel-note{font-size:12px;line-height:1.8;color:var(--ink-light);margin:13px 0 0}
.point-rules{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.point-rules li{padding:12px;background:#f7faf6;border-radius:12px}
.point-rules strong{font-size:14px;color:var(--green);display:block;margin-bottom:5px}
.point-rules p{margin:0;color:var(--ink-light);font-size:12px;line-height:1.85}
.point-caution{margin-top:16px;background:#fdf8ed;border-left:3px solid var(--gold);padding:11px 13px;border-radius:0 10px 10px 0;color:#564a39;font-size:12px;line-height:1.8}
.point-navigation{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0}
.point-navigation button{min-height:44px;border-radius:11px;border:1px solid #d0e1d4;padding:7px 8px;font-size:13px;color:var(--green);font-weight:750;background:white}
.point-navigation button:last-child{background:var(--green);color:#fff}
.point-navigation button:disabled{opacity:.37}
.point-counter{min-width:35px;text-align:center;font-size:12px;font-weight:800;color:var(--ink-light);font-variant-numeric:tabular-nums}
.point-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.point-tab{min-width:0;min-height:44px;font-size:11px;line-height:1.5;border:1px solid #d8e3d9;border-radius:9px;color:var(--green);background:#fff;font-weight:700;padding:5px 3px}
.point-tab[aria-pressed="true"]{color:#fff;background:var(--green);border-color:var(--green)}
.point-follow{display:grid;gap:10px;margin:18px 0}
.point-follow a{display:flex;align-items:center;justify-content:center;min-height:49px;padding:10px;border-radius:12px;border:1px solid #d0e1d4;text-decoration:none;text-align:center;color:var(--green);background:#fff;font-weight:700;font-size:13px}
@media(max-width:340px){.point-panel{padding:16px 10px}.groups-summary span{font-size:11px}.groups-summary b{font-size:12px}.point-tab{font-size:10px}.big-rule strong{font-size:30px}}
@media(prefers-reduced-motion:reduce){.point-track{scroll-behavior:auto}}


/* Adapt the existing point-allocation lesson design. Does not alter its source page. */
.lesson-index-title{margin:24px 0 8px;text-align:center;font-size:23px;color:var(--green)}
.lesson-index-lead{font-size:13px;line-height:1.85;text-align:center;color:var(--ink-light);margin:0 0 22px}
.lesson-index-list{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.lesson-index-link{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:70px;padding:13px 12px;border:1px solid #dce7dc;border-radius:15px;background:#fffefa;color:var(--ink);text-decoration:none}
.lesson-index-link span{display:grid;place-items:center;min-height:41px;background:#eff6ed;border-radius:10px;color:var(--green);font-size:12px;font-weight:800}
.lesson-index-link strong{font-size:14px;line-height:1.6;font-weight:750;overflow-wrap:anywhere}
.lesson-index-link em{font-style:normal;color:var(--gold);font-size:16px}
.lesson-index-note{margin:15px 0;color:var(--ink-light);font-size:12px;line-height:1.8}
.lesson-week-picker{display:grid;gap:5px;margin:18px 0 3px;font-size:12px;color:var(--ink-light);font-weight:750}
.lesson-week-picker select{width:100%;min-width:0;border:1px solid #cfdfd1;border-radius:11px;background:#fffefa;color:var(--ink);min-height:48px;padding:8px 10px;font-size:16px}
.lesson-para{margin:8px 0 13px;color:var(--ink-light);font-size:13px;line-height:1.9;overflow-wrap:anywhere;word-break:normal}
.lesson-section-title{font-size:15px;line-height:1.6;color:var(--green);margin:18px 0 9px;font-weight:800}
.lesson-section-title:first-child{margin-top:0}
.lesson-quote{margin:10px 0;padding:11px 12px;background:#f5f9f3;border-left:3px solid var(--gold);border-radius:0 9px 9px 0;color:var(--ink);line-height:1.8;font-size:13px}
.lesson-bullets{padding:0 0 0 20px;margin:7px 0 15px;color:var(--ink-light);font-size:13px;line-height:1.85}
.lesson-bullets li{padding-left:2px;margin:5px 0}
.lesson-kicker{font-size:12px!important;line-height:1.6;color:var(--gold)!important;font-weight:800;margin-top:17px!important}
.lesson-tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 1px 9px}
.lesson-tabs::-webkit-scrollbar{display:none}
.lesson-tabs button{flex:0 0 auto;min-height:43px;padding:7px 12px;border:1px solid #d8e3d9;border-radius:10px;background:#fff;color:var(--green);font-size:12px;font-weight:750}
.lesson-tabs button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}
.lesson-note{margin:15px 0;background:#faf8f0;border-left:3px solid var(--gold);padding:10px 12px;border-radius:0 9px 9px 0;color:#675a47;font-size:12px;line-height:1.8}
.lesson-week-nav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:13px 0}
.lesson-week-nav a{display:flex;justify-content:center;align-items:center;text-align:center;min-height:50px;border:1px solid #cde0d0;border-radius:11px;background:#fff;color:var(--green);text-decoration:none;font-size:13px;font-weight:750;padding:10px}
.lesson-week-nav a[hidden]{display:none!important}
.lesson-step-link{display:flex;align-items:center;justify-content:center;min-height:50px;padding:10px;text-decoration:none;background:#f2f8f1;color:var(--green);border:1px solid #cee0cf;border-radius:11px;text-align:center;font-size:13px;font-weight:800;margin:12px 0}
.point-panel{min-height:0}
.point-panel h2{overflow-wrap:anywhere}
.point-track{align-items:flex-start}
.lesson-empty{padding:12px;color:var(--ink-light);font-size:13px}
@media(max-width:340px){.lesson-index-link{grid-template-columns:47px minmax(0,1fr) auto;gap:8px}.lesson-index-link strong{font-size:12px}.lesson-tabs button{font-size:11px}}
</style>
</head>
<body>
<main class="viewport"><article class="page">
 <nav class="topbar" aria-label="ページ移動"><a class="back" href="./learning.html">〈 学び一覧へ戻る</a><span class="step">12 WEEKS</span></nav>
 <p class="wordmark" aria-label="EQUINERIS">EQUI<span>NERIS</span></p>
 <div id="lessonIndex">
  <h1 class="lesson-index-title">12週間の学び</h1>
  <p class="lesson-index-lead" id="lessonIndexLead">読みたい週を選んでください。学習ページはいつでも見返せます。</p>
  <nav class="lesson-index-list" id="lessonIndexList" aria-label="12週間の教材一覧"></nav>
  <p class="lesson-index-note">食品や栄養素の記録・自動計算は別機能です。ここは学習本文を読む画面です。</p>
 </div>
 <div id="lessonView" hidden>
  <label class="lesson-week-picker" for="weekPicker">学習する週を選ぶ
   <select id="weekPicker" aria-label="学習する週"></select>
  </label>
  <header class="heading"><p class="eyebrow">SMART DIET · WEEKLY LESSON</p><h1 id="lessonTitle"></h1><p id="lessonIntro"></p></header>
  <p class="point-intro" id="lessonInstructions">左右にスワイプ、または下のボタンで4枚の教材を読み進められます。</p>
  <div class="point-track" id="lessonTrack" tabindex="0" role="region" aria-label="12週間プログラムの週別学習" aria-describedby="lessonInstructions"></div>
  <nav class="point-navigation" aria-label="学習カードを切り替える"><button id="lessonPrev" type="button" disabled>〈 前へ</button><span id="lessonCounter" class="point-counter" aria-live="polite">1 / 4</span><button id="lessonNext" type="button">次へ 〉</button></nav>
  <div class="lesson-tabs" id="lessonTabs" role="group" aria-label="教材カードを選ぶ"></div>
  <p id="lessonVisualNote" class="lesson-note" hidden></p>
  <a class="lesson-step-link" id="lessonCompanion" href="./food-groups.html" hidden>関連教材を開く</a>
  <nav class="lesson-week-nav" aria-label="週を移動する"><a id="previousWeek" href="./learning.html?week=1">〈 前の週</a><a id="nextWeek" href="./learning.html?week=2">次の週 〉</a></nav>
  <a class="lesson-step-link" href="./learning.html">12週間の学び一覧へ戻る</a>
 </div>
</article></main>
<script src="./learning-data.js?v=8bb4b8ea"></script>
<script>
'use strict';
(()=>{
const data=window.SMART_DIET_LESSONS;
const index=document.getElementById('lessonIndex');
const content=document.getElementById('lessonView');
const list=document.getElementById('lessonIndexList');
const picker=document.getElementById('weekPicker');
const heading=document.getElementById('lessonTitle');
const intro=document.getElementById('lessonIntro');
const track=document.getElementById('lessonTrack');
const prev=document.getElementById('lessonPrev');
const next=document.getElementById('lessonNext');
const counter=document.getElementById('lessonCounter');
const tabs=document.getElementById('lessonTabs');
const before=document.getElementById('previousWeek');
const after=document.getElementById('nextWeek');
const companion=document.getElementById('lessonCompanion');
const visualNote=document.getElementById('lessonVisualNote');
if(!Array.isArray(data)||data.length!==12||data.some((week,i)=>week.week!==i+1)){
 index.hidden=false;content.hidden=true;
 document.getElementById('lessonIndexLead').textContent='教材を読み込めませんでした。ページを再読み込みしてください。';
 return;
}
let slideIndex=0,pending=false;
const node=(tag,cls,text)=>{
 const e=document.createElement(tag);
 if(cls)e.className=cls;
 if(text!==undefined)e.textContent=text;
 return e;
};
for(const entry of data){
 const link=document.createElement('a');
 link.className='lesson-index-link';
 link.href='./learning.html?week='+entry.week;
 link.appendChild(node('span','',String(entry.week).padStart(2,'0')+'週'));
 link.appendChild(node('strong','',entry.title));
 link.appendChild(node('em','','›'));
 list.appendChild(link);
 const option=document.createElement('option');option.value=String(entry.week);
 option.textContent='第'+entry.week+'週 · '+entry.title;
 picker.appendChild(option);
}
function addBody(container,raw){
 const lines=String(raw||'').replace(/\r/g,'').split(/\n/).map(x=>x.trim()).filter(Boolean);
 let sentence='',bullet=null;
 const finish=()=>{
  if(sentence.trim())container.appendChild(node('p','lesson-para',sentence.trim()));
  sentence='';
 };
 for(const line of lines){
  if(/^─+$/.test(line))continue;
  if(/^【[^】]+】$/.test(line)){
   finish();bullet=null;container.appendChild(node('p','lesson-kicker',line.slice(1,-1)));continue;
  }
  if(/^・/.test(line)||/^□/.test(line)){
   finish();
   if(!bullet){bullet=node('ul','lesson-bullets');container.appendChild(bullet);}
   bullet.appendChild(node('li','',line.slice(1).trim()));continue;
  }
  bullet=null;
  if(/^[A-CＡ-Ｃ][．.]/.test(line)){finish();container.appendChild(node('p','lesson-kicker',line));continue;}
  sentence+=line;
  if(/[。！？!?」]$/.test(line)){finish();}
 }
 finish();
}
function showSection(panel,title,text){
 if(!text||!text.trim())return;
 panel.appendChild(node('h3','lesson-section-title',title));
 addBody(panel,text);
}
function slide(title,subtitle,sections){
 const section=node('section','point-slide');
 section.setAttribute('role','group');
 section.setAttribute('aria-roledescription','スライド');
 const panel=node('div','point-panel');
 panel.appendChild(node('p','point-label',subtitle));
 panel.appendChild(node('h2','',title));
 for(const item of sections)showSection(panel,item.title,item.text);
 section.appendChild(panel);
 return section;
}
function groupLesson(entry){
 const rows=entry.sections;
 const introduction=rows.find(x=>/今週のお話|最終今週のお話/.test(x.title));
 const actions=rows.filter(x=>/今週やってみること|やってみよう|実践|自分の“戻し方”を決める/.test(x.title));
 const reflection=rows.filter(x=>/ふり返り|振り返り|週の終わり|最初の目標と比べる/.test(x.title));
 const used=new Set([introduction,...actions,...reflection].filter(Boolean));
 const learning=rows.filter(x=>!used.has(x));
 const sections=[
  [{title:'この週について',text:entry.introduction},introduction].filter(Boolean),
  learning,
  actions.length?actions:[{title:'今日覚えてほしいこと',text:entry.summary||'学んだポイントを1つ思い出しましょう。'}],
  reflection.length?reflection:[{title:'振り返り',text:entry.summary||'今週の内容を見返しましょう。'}]
 ];
 return sections;
}
function update(){
 const slides=[...track.children];
 if(!slides.length)return;
 slideIndex=Math.max(0,Math.min(slides.length-1,slideIndex));
 counter.textContent=(slideIndex+1)+' / '+slides.length;
 prev.disabled=slideIndex===0;
 next.disabled=slideIndex===slides.length-1;
 [...tabs.children].forEach((tab,i)=>tab.setAttribute('aria-pressed',String(i===slideIndex)));
}
function go(i,smooth=true){
 slideIndex=Math.max(0,Math.min(track.children.length-1,i));
 update();
 const reduced=typeof window.matchMedia==='function'&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 track.scrollTo({left:slideIndex*track.clientWidth,behavior:smooth&&!reduced?'smooth':'auto'});
}
function loadWeek(n){
 const entry=data[n-1];
 if(!entry){index.hidden=false;content.hidden=true;return;}
 index.hidden=true;content.hidden=false;
 picker.value=String(n);
 heading.textContent='第'+n+'週｜'+entry.title;
 intro.textContent='SMART Diet 12週間プログラムの第'+n+'週の学びです。左右にスワイプしながら読み進めましょう。';
 document.title='第'+n+'週｜'+entry.title+' | SMART Diet';
 const groups=groupLesson(entry);
 const titles=['今週のお話','学ぶポイント','今週の実践','振り返り'];
 track.replaceChildren();tabs.replaceChildren();
 groups.forEach((sections,i)=>{
  track.appendChild(slide(titles[i],'WEEK '+n+' · '+String(i+1).padStart(2,'0'),sections));
  const tab=node('button','',titles[i]);tab.type='button';tab.setAttribute('aria-pressed',String(i===0));
  tab.addEventListener('click',()=>go(i));
  tabs.appendChild(tab);
 });
 before.hidden=n===1;after.hidden=n===12;
 before.href='./learning.html?week='+(n-1);
 after.href='./learning.html?week='+(n+1);
 companion.hidden=true;
 if(n===2){companion.href='./habit-check.html?day=1';companion.textContent='食習慣チェックを開く';companion.hidden=false;}
 if(n===3){companion.href='./food-groups.html?day=1';companion.textContent='4つの食品群と点数配分を詳しく見る';companion.hidden=false;}
 visualNote.hidden=!entry.pendingVisualSections.length;
 if(!visualNote.hidden){
  visualNote.textContent='写真や具体的な食事例が必要な「'+entry.pendingVisualSections.join('」「')+'」は、元の教材に画像・確定した数値が含まれていないため、この学習画面には未掲載です。';
 }
 slideIndex=0;track.scrollLeft=0;update();
}
prev.addEventListener('click',()=>go(slideIndex-1));
next.addEventListener('click',()=>go(slideIndex+1));
track.addEventListener('scroll',()=>{
 if(pending)return;pending=true;
 requestAnimationFrame(()=>{
  pending=false;
  const n=Math.round(track.scrollLeft/(track.clientWidth||1));
  if(n!==slideIndex){slideIndex=n;update();}
 });
},{passive:true});
track.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'){e.preventDefault();go(slideIndex+1);}
 if(e.key==='ArrowLeft'){e.preventDefault();go(slideIndex-1);}
});
window.addEventListener('resize',()=>go(slideIndex,false));
picker.addEventListener('change',()=>{
 const n=Number(picker.value);
 if(n>=1&&n<=12){
  window.history.replaceState(null,'','./learning.html?week='+n);
  loadWeek(n);
 }
});
const query=new URLSearchParams(window.location.search);
const requested=Number(query.get('week'));
if(Number.isInteger(requested)&&requested>=1&&requested<=12)loadWeek(requested);
else{index.hidden=false;content.hidden=true;}
})();
</script>
