<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdfa">
<meta name="description" content="EQUINERISの食事記録。1つのページでSTEP1・STEP2・STEP3の入力方法を切り替え、全期間の記録を振り返れます。">
<title>食事記録 | EQUINERIS</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color-scheme:light;--green:#285d4a;--ink:#173b33;--sub:#526c5d;--edge:#d7e4d8;--paper:#fffdfa}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden;-webkit-text-size-adjust:100%}
body{margin:0;min-width:280px;background:#ecf1eb;color:var(--ink)}
button,input,a{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #bc975a;outline-offset:2px}
.shell{width:100%;max-width:560px;margin:0 auto;min-height:100svh;background:var(--paper);padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.header{display:flex;justify-content:space-between;align-items:center;gap:9px;min-height:44px}
.header a{font-size:12px;font-weight:700;color:var(--green);text-decoration:none;line-height:1.6;min-height:44px;display:flex;align-items:center}
.wordmark{font-size:16px;letter-spacing:.06em;font-weight:850;white-space:nowrap}.wordmark span{color:#a6844e}
h1{font-size:23px;line-height:1.45;text-align:center;margin:0}
.intro{font-size:12px;color:var(--sub);line-height:1.7;text-align:center;margin:0}
.date-box{display:flex;align-items:center;justify-content:center;gap:12px;background:#f5f9f3;border:1px solid var(--edge);border-radius:12px;padding:7px 10px;min-height:50px}
.date-box label{font-size:13px;font-weight:750}
.date-box input{width:min(205px,65%);min-width:0;font-size:16px;color:var(--ink);height:39px;padding:6px 8px;border:1px solid #a9c8b0;border-radius:9px;background:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;min-width:0}
.tab{display:flex;align-items:center;justify-content:center;min-height:48px;background:#f4f8f2;border:1px solid var(--edge);border-radius:11px;color:var(--green);font-size:13px;font-weight:750;padding:6px 2px;min-width:0;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff}
.status{font-size:12px;line-height:1.65;color:var(--sub);margin:0 2px;min-height:20px;text-align:center;overflow-wrap:break-word}
.status[data-error="true"]{color:#a6382e}
.frame-wrap{border:1px solid var(--edge);border-radius:14px;background:#fff;overflow:hidden;min-height:320px;flex:1;min-width:0}
#recordFrame{display:block;border:0;width:100%;height:calc(100svh - 259px);min-height:390px;background:#fff}
.help{margin:0;color:var(--sub);font-size:11px;line-height:1.65;text-align:center}
@media(max-width:360px){.shell{padding-inline:7px;gap:8px}.tab{font-size:12px}.wordmark{font-size:14px}#recordFrame{min-height:365px}}
@media(min-width:600px){.shell{margin:12px auto;min-height:calc(100svh - 24px);border:1px solid var(--edge);border-radius:20px}#recordFrame{height:calc(100svh - 290px);min-height:480px}}
</style>
</head>
<body>
<main class="shell">
 <header class="header">
  <a href="./textbook.html#s4-c4">〈 教材に戻る</a>
  <span class="wordmark" aria-label="EQUINERIS">EQUI<span>NERIS</span></span>
 </header>
 <h1>食事記録</h1>
 <p class="intro">ページを移動せずに、入力方法とこれまでの記録を切り替えられます。</p>
 <div class="date-box" id="dateBox">
  <label for="recordDate">記録日</label>
  <input id="recordDate" type="date" aria-label="記録する日付">
 </div>
 <nav class="tabs" aria-label="食事記録の入力方法と履歴" role="tablist">
  <button type="button" class="tab" role="tab" aria-selected="true" data-view="1" aria-controls="recordFrame">STEP1</button>
  <button type="button" class="tab" role="tab" aria-selected="false" data-view="2" aria-controls="recordFrame">STEP2</button>
  <button type="button" class="tab" role="tab" aria-selected="false" data-view="3" aria-controls="recordFrame">STEP3</button>
  <button type="button" class="tab" role="tab" aria-selected="false" data-view="history" aria-controls="recordFrame">振り返り</button>
 </nav>
 <p class="status" id="recordStatus" role="status" aria-live="polite">記録画面を読み込んでいます。</p>
 <div class="frame-wrap">
  <iframe id="recordFrame" title="食事記録 STEP1" loading="eager" referrerpolicy="same-origin"></iframe>
 </div>
 <p class="help">記録と写真はこのブラウザに保存されます。別端末への自動同期はありません。</p>
</main>
<script src="./record-unified.js?v=20261123-single-page-v2"></script>
</body>
</html>
