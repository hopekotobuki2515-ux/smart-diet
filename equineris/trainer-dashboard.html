<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>EQUINERIS | トレーナー管理</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#eef4eb;color:#183e38}main{margin:auto;max-width:640px;min-height:100vh;padding:24px 16px;background:#fffdf8}h1{font-size:22px}.card{padding:16px;margin:12px 0;border:1px solid #d9e5d8;background:white;border-radius:15px}input,textarea{font:inherit;display:block;width:100%;min-height:46px;padding:10px;margin:6px 0;border:1px solid #bdccbc;border-radius:10px}textarea{min-height:120px}button{font:inherit;background:#285d4a;color:#fff;border:0;border-radius:10px;padding:11px 14px;min-height:46px;cursor:pointer}button.secondary{background:#edf4eb;color:#285d4a}.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.thumbs img{width:100%;height:auto;border:1px solid #ddd;border-radius:10px}small{color:#526c61}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px}.status{font-size:13px;color:#8f3f32}[hidden]{display:none!important}</style></head><body><main><h1>EQUINERIS トレーナーチェック</h1><p>食事写真と記録を確認し、コメントを返信します。トレーナー専用画面です。</p><p id="status" class="status"></p><section class="card" id="loginPanel"><h2>トレーナーログイン</h2><form id="loginForm"><label>パスワード<input type="password" id="password" autocomplete="current-password" required></label><button type="submit">ログイン</button></form></section><section id="reviewPanel" hidden><button id="refresh" class="secondary">確認依頼を更新</button> <button id="logout" class="secondary">ログアウト</button><div id="requests"></div></section></main><script src="./trainer-dashboard.js?v=20261124-post-list"></script></body></html>
