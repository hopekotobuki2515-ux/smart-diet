<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMART Diet 食行動改善</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#fff8f1;color:#222}
header{background:#ef6c00;color:white;padding:18px}
main{max-width:760px;margin:auto;padding:14px 12px 80px}
.card{background:white;border:1px solid #eee;border-radius:16px;padding:16px;margin:12px 0}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:sticky;top:0;background:#fff8f1;padding:8px 0}
nav button,.secondary{padding:10px;border-radius:12px;border:1px solid #ddd;background:white}
nav button.active,.secondary.active,.primary{background:#ef6c00;color:white;border:none}
.primary{width:100%;padding:13px;border-radius:12px;font-weight:700}
.q{padding:11px 0;border-bottom:1px solid #eee}
.goal{border:1px solid #eee;border-radius:14px;padding:12px;margin:10px 0}
.choice{display:flex;gap:8px}.choice button{flex:1;padding:10px;border-radius:12px;border:1px solid #ddd;background:white}
.ok.sel{background:#e8f5e9}.ng.sel{background:#ffebee}
.hidden{display:none}.muted{color:#666;font-size:13px}.bar{height:12px;background:#eee;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#ef6c00}
</style>
</head>
<body>
<header><h1>SMART Diet 食行動改善</h1><div>初めての方は「初回診断」から始めてください</div></header>
<main>
<nav>
<button data-tab="diagnosis" class="active">初回診断</button>
<button data-tab="today">今日</button>
<button data-tab="progress">進捗</button>
<button data-tab="history">履歴</button>
<button data-tab="settings">設定</button>
</nav>

<section id="diagnosis">
<div class="card">
<h2>食習慣チェック</h2>
<p class="muted">当てはまる項目にチェックしてください。</p>
<div id="questions"></div>
<button class="primary" id="saveDiagnosis">診断結果を保存</button>
</div>
<div class="card hidden" id="goalPickerCard">
<h2>最初の改善目標</h2>
<p class="muted">まずは最大3つに絞ります。</p>
<div id="goalPicker"></div>
<button class="primary" id="saveGoals">この目標で始める</button>
</div>
</section>

<section id="today" class="hidden">
<div class="card">
<h2>今日のチェック</h2>
<div id="todayGoals"></div>
<h3>日付</h3>
<input id="testDate" type="date">
  <h3>体重（任意）</h3>
<input id="weight" type="number" step="0.1" placeholder="例 70.5" style="width:100%;padding:11px;border:1px solid #ddd;border-radius:10px">
<br><br>
<button class="primary" id="saveToday">今日の記録を保存</button>
</div>
</section>
<section id="history" class="hidden">
  <div class="card">
    <h2>記録履歴</h2>
    <div id="historyList"></div>
  </div>

  <div class="card">
    <h2>体重の推移</h2>
   <div style="display:flex;gap:8px;margin-bottom:10px">
<button class="secondary" id="range7" style="flex:1;font-size:16px">7日</button>
<button class="secondary" id="range30" style="flex:1;font-size:16px">30日</button>
<button class="secondary" id="rangeAll" style="flex:1;font-size:16px">全期間</button>
</div>
    <canvas id="weightChart" width="700" height="300"></canvas>

  </div>
</section>
<section id="progress" class="hidden">
<div class="card"><h2>進捗</h2><div id="progressBody"></div></div>
</section>

<section id="settings" class="hidden">
<div class="card">
<h2>現在の改善目標</h2>
<div id="currentGoals"></div>
<br><button class="secondary" id="resetAll">試作データをすべて消す</button>
</div>
<div class="card"><p class="muted">この試作版は記録をこのブラウザ内に保存します。別のスマホとはまだ同期しません。</p></div>
</section>
</main>

<script>
const H=[
["leftovers","お腹が空いていなくても残り物を食べることがある"],
["snacks_home","お菓子を家に常備している"],
["fast","食べるのが速い"],
["not_chew","よく噛まずに食べることが多い"],
["grazing","食事以外の時間につい何か食べる"],
["fruit_over","果物を食べすぎることがある"],
["fried","揚げ物や油を使った料理が多い"],
["strong_taste","味の濃い料理を選ぶことが多い"],
["veg_juice","野菜を野菜ジュースだけで済ませることがある"],
["skip_breakfast","朝食を抜くことがある"],
["eat_out","外食・中食が多い"],
["single_dish","丼物・麺類・ファストフードをよく選ぶ"],
["snacking","間食をほぼ毎日している"],
["late_eating","夜9時以降に食べることが多い"],
["alcohol","お酒をほぼ毎日飲む"]
];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const get=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const day=()=>{
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const date=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${date}`;
};
function title(id){return H.find(x=>x[0]===id)[1]}
function renderQ(){const s=get("diagnosis",[]);$("#questions").innerHTML=H.map(([id,t])=>`<div class=q><label><input type=checkbox value="${id}" ${s.includes(id)?"checked":""}> ${t}</label></div>`).join("")}
function renderPicker(){const d=get("diagnosis",[]),g=get("goals",[]);$("#goalPickerCard").classList.toggle("hidden",!d.length);$("#goalPicker").innerHTML=d.map(id=>`<div class=q><label><input class=goalPick type=checkbox value="${id}" ${g.includes(id)?"checked":""}> ${title(id)}</label></div>`).join("")}
function renderToday(){const g=get("goals",[]),logs=get("logs",{}),r=logs[day()]||{};$("#weight").value=r.weight||"";$("#todayGoals").innerHTML=g.length?g.map(id=>`<div class=goal data-id="${id}"><b>${title(id)}</b><div class=choice><button class="ok ${r[id]==="ok"?"sel":""}" data-v=ok>できた</button><button class="ng ${r[id]==="ng"?"sel":""}" data-v=ng>できなかった</button></div></div>`).join(""):"<p>まず初回診断をしてください。</p>";$$(".choice button").forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")})}
function renderProgress(){const g=get("goals",[]),logs=get("logs",{}),dates=Object.keys(logs).sort().slice(-7);$("#progressBody").innerHTML=g.length?g.map(id=>{let n=0,o=0;dates.forEach(d=>{if(logs[d][id]){n++;if(logs[d][id]==="ok")o++}});let r=n?Math.round(o/n*100):0;let status=o>=7?"7日達成！":o>=5?"定着してきています":o>=3?"改善中":"慣らし中";return `<div class=goal><b>${title(id)}</b><p>${r}%（直近7日・記録${n}日）<p><b>${status}</b></p></p><div class=bar><span style="width:${r}%"></span></div></div>`}).join(""):"<p>まだ記録がありません。</p>"}
function renderHistory(){const logs=get("logs",{}),dates=Object.keys(logs).sort().reverse();$("#historyList").innerHTML=dates.length?dates.map(d=>{const r=logs[d]||{};const items=Object.entries(r).filter(([k])=>k!=="weight").map(([k,v])=>`<div>${title(k)}：${v==="ok"?"できた":v==="ng"?"できなかった":"未記録"}</div>`).join("");return `<div class="goal"><b>${d}</b>${r.weight?`<div>体重：${r.weight}kg</div>`:""}${items}</div>`}).join(""):"<p>まだ記録がありません。</p>";drawWeightChart();}
let weightRange="all";
function drawWeightChart(){const c=$("#weightChart");if(!c)return;const ctx=c.getContext("2d"),logs=get("logs",{}),data=Object.keys(logs).sort().map(d=>({d,w:Number(logs[d]?.weight)})).filter(x=>x.w>0);ctx.clearRect(0,0,c.width,c.height);if(!data.length){ctx.font="16px sans-serif";ctx.fillText("体重記録がありません",20,40);return;}const p=40,min=Math.min(...data.map(x=>x.w)),max=Math.max(...data.map(x=>x.w)),range=(max-min)||1;ctx.beginPath();data.forEach((x,i)=>{const px=p+i*((c.width-p*2)/Math.max(data.length-1,1)),py=c.height-p-((x.w-min)/range)*(c.height-p*2);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();data.forEach((x,i)=>{const px=p+i*((c.width-p*2)/Math.max(data.length-1,1)),py=c.height-p-((x.w-min)/range)*(c.height-p*2);ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();ctx.fillText(x.w+"kg",px-15,py-10)});}
drawWeightChart=function(){
  const c=$("#weightChart");
  if(!c)return;

  const ctx=c.getContext("2d");
  const logs=get("logs",{});

  let dates=Object.keys(logs)
    .sort()
    .filter(d=>logs[d].weight);

  if(weightRange==="7") dates=dates.slice(-7);
  if(weightRange==="30") dates=dates.slice(-30);

  const data=dates.map(d=>({
    date:d,
    weight:Number(logs[d].weight)
  }));

  ctx.clearRect(0,0,c.width,c.height);

  if(!data.length){
    ctx.font="16px sans-serif";
    ctx.fillText("体重記録がありません",20,40);
    return;
  }

  const pad=40;
  const min=Math.min(...data.map(x=>x.weight));
  const max=Math.max(...data.map(x=>x.weight));
  const range=(max-min)||1;
// 補助線
ctx.strokeStyle = "#eeeeee";
ctx.lineWidth = 1;

// 横線（5本）
for(let i=0; i<=4; i++){
  const gy = pad + ((c.height - pad*2) / 4) * i;
  ctx.beginPath();
  ctx.moveTo(pad, gy);
  ctx.lineTo(c.width - pad, gy);
  ctx.stroke();
}

// 縦線
data.forEach((p,i)=>{
  const gx = pad + (c.width - pad*2) * (data.length===1 ? 0.5 : i/(data.length-1));

  ctx.strokeStyle="#eeeeee";
  ctx.lineWidth=1;

  ctx.beginPath();
  ctx.moveTo(gx,pad);
  ctx.lineTo(gx,c.height-pad);
  ctx.stroke();
});

  ctx.beginPath();

  data.forEach((p,i)=>{
    const x=pad+(c.width-pad*2)*(data.length===1?0.5:i/(data.length-1))
    const y=data.length===1
  ? pad+20
  : c.height-pad-(c.height-pad*2)*((p.weight-min)/range);

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
    ctx.fillStyle="#222";
    ctx.font="bold 22px sans-serif";
    
ctx.fillText(p.weight+"kg",x-12,y-10);

ctx.font="18px sans-serif";
ctx.fillText(p.date.slice(5),x-18,y+32);
  });
  ctx.lineWidth=3;
ctx.strokeStyle="#ef6c00";
if(data.length>=2){
  ctx.stroke();
}
  data.forEach((p,i)=>{
  const x=pad+(c.width-pad*2)*(data.length===1?0.5:i/(data.length-1));
const y=data.length===1
  ? pad+20
  : c.height-pad-(c.height-pad*2)*((p.weight-min)/range);

  ctx.fillStyle="#ef6c00";
  ctx.beginPath();
  ctx.arc(x,y,6,0,Math.PI*2);
  ctx.fill();
});
};
$("#range7").onclick=()=>{weightRange="7";$("#range7").classList.add("active");$("#range30").classList.remove("active");$("#rangeAll").classList.remove("active");drawWeightChart();};

$("#range30").onclick=()=>{weightRange="30";$("#range7").classList.remove("active");$("#range30").classList.add("active");$("#rangeAll").classList.remove("active");drawWeightChart();};

$("#rangeAll").onclick=()=>{weightRange="all";$("#range7").classList.remove("active");$("#range30").classList.remove("active");$("#rangeAll").classList.add("active");drawWeightChart();};

function renderSettings(){const g=get("goals",[]);$("#currentGoals").innerHTML=g.length?g.map(id=>`<div class="goal"><span>${title(id)}</span><button class="removeGoal" data-id="${id}">外す</button></div>`).join(""):"<p>設定されていません。</p>";$$(".removeGoal").forEach(b=>b.onclick=()=>{let goals=get("goals",[]).filter(x=>x!==b.dataset.id);let d=get("diagnosis",[]).filter(x=>x!==b.dataset.id);set("goals",goals);set("diagnosis",d);renderSettings();renderProgress();renderQ();renderPicker();});}
function show(id){["diagnosis","today","progress","history","settings"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==id));$$("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));if(id==="today")renderToday();if(id==="progress")renderProgress();if(id==="history")renderHistory();if(id==="settings")renderSettings()}
$$("nav button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
$("#saveDiagnosis").onclick=()=>{const d=$$("#questions input:checked").map(x=>x.value);set("diagnosis",d);set("goals",get("goals",[]).filter(x=>d.includes(x)));renderPicker();$("#goalPickerCard").scrollIntoView({behavior:"smooth"})};
$("#saveGoals").onclick=()=>{const g=$$(".goalPick:checked").map(x=>x.value);if(!g.length||g.length>3){alert("1〜3項目を選んでください");return}set("goals",g);show("today")};
$("#saveToday").onclick=()=>{
  const saveDate=$("#testDate").value || day();
  const logs=get("logs",{}),r=logs[saveDate]||{};

  $$(".goal").forEach(g=>{
    const s=g.querySelector(".sel");
    if(s) r[g.dataset.id]=s.dataset.v;
  });

  if($("#weight").value){
    r.weight=Number($("#weight").value);
  }

  logs[saveDate]=r;
  set("logs",logs);
  alert("保存しました");
};

  $("#resetAll").onclick=()=>{if(confirm("すべて削除しますか？")){localStorage.clear();location.reload()}};
renderQ();renderPicker();
$("#testDate").value = day();
</script>
</body></html>
