name: Update only HOPE homepage blog and Kurashi URLs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-hope-homepage-sakura-links.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-hope-mobile-sakura
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hopekotobuki2515-ux/hope-homepage
          ref: 24b8205d93a87d9cfc60aaa04e92307c30eeff74
          persist-credentials: false
      - name: Verify all replacement targets before publishing
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.request import urlopen
          class Parser(HTMLParser):
              def __init__(self): super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  href=dict(attrs).get('href','')
                  if href.startswith(('https://rakudadou.sakura.ne.jp/hope-blog/','https://rakudadou.sakura.ne.jp/kurashi/')): self.urls.append(href)
          p=Parser(); p.feed(Path('index.html').read_text())
          assert len(p.urls)==13, len(p.urls)
          assert len(set(p.urls))==10
          for url in sorted(set(p.urls)):
              with urlopen(url,timeout=20) as r:
                  assert r.status==200, (url,r.status)
                  print('HTTP 200',url)
          PY
      - name: Guard and publish index.html only
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null
          ssh-keyscan -T 10 -H "$SAKURA_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" 'cat /home/rakudadou/www/hope-mobile/index.html' > /tmp/live-index.html
          python3 - <<'PY'
          from pathlib import Path
          old=Path('/tmp/live-index.html').read_bytes()
          expected=old
          for a,b,n in [(b'https://hope-fitness.jp/',b'https://rakudadou.sakura.ne.jp/hope-blog/',11),(b'https://rakudadou719.web.fc2.com/',b'https://rakudadou.sakura.ne.jp/kurashi/',2)]:
              assert expected.count(b'href="'+a)==n, (a,'unexpected live revision')
              expected=expected.replace(b'href="'+a,b'href="'+b)
          assert expected==Path('index.html').read_bytes(), 'Unexpected differences; stop without overwriting'
          print('PASS: exactly 13 href replacements; all other bytes identical')
          PY
          oldsha=$(sha256sum /tmp/live-index.html | cut -d' ' -f1)
          newsha=$(sha256sum index.html | cut -d' ' -f1)
          stage=$(ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" 'umask 077; mktemp /home/rakudadou/hope-home-link-stage.XXXXXXXX')
          [[ "$stage" =~ ^/home/rakudadou/hope-home-link-stage\.[A-Za-z0-9]+$ ]]
          scp -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes index.html "$SAKURA_USER@$SAKURA_HOST:$stage"
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" "sh -s -- $oldsha $newsha $stage" <<'REMOTE'
          set -eu
          oldsha=$1
          newsha=$2
          stage=$3
          f=/home/rakudadou/www/hope-mobile/index.html
          trap 'rm -f "$stage"' EXIT
          test -f "$f" && test ! -L "$f"
          test -f "$stage" && test ! -L "$stage"
          php -r 'if(hash_file("sha256",$argv[1])!==$argv[2])exit(1);' "$f" "$oldsha"
          php -r 'if(hash_file("sha256",$argv[1])!==$argv[2])exit(1);' "$stage" "$newsha"
          b=$(mktemp -d /home/rakudadou/hope-home-link-backup.XXXXXXXX)
          cp -p "$f" "$b/index.html"
          chmod 644 "$stage"
          mv -f "$stage" "$f"
          echo 'PASS: Published index.html only'
          REMOTE
      - name: Confirm live page matches exact updated source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          with urlopen('https://rakudadou.sakura.ne.jp/hope-mobile/?linkcheck=1',timeout=20) as r:
              assert r.status==200
              assert r.read()==Path('index.html').read_bytes(),'Public source mismatch'
          print('PASS: live homepage exact source match; all 13 links replaced.')
          PY
