name: Revise HOPE skin article lead sentence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/revise-hope-skin-lead-20261128.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hope-blog-production-host
  cancel-in-progress: false
jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update requested sentence only
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null
          ssh-keyscan -T 10 -H "$SAKURA_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" 'sh -s' <<'REMOTE'
          set -eu
          D=/home/rakudadou/hope-blog-private/data
          T=$(mktemp -d "$D/skin-lead.XXXXXXXX")
          trap 'rm -rf "$T"' EXIT
          cat > "$T/revise.php" <<'PHP'
          <?php
          declare(strict_types=1);
          $_SERVER['SCRIPT_NAME']='/hope-blog/index.php';
          require '/home/rakudadou/www/hope-blog/common.php';
          if(realpath(DATA)!=='/home/rakudadou/hope-blog-private/data')throw new RuntimeException('Unexpected DATA location');
          $lock=fopen(DATA.'write.lock','c');if(!$lock||!flock($lock,LOCK_EX))throw new RuntimeException('Lock failed');
          try{
           if(is_link(DATA.'articles.json')||!is_file(DATA.'articles.json'))throw new RuntimeException('Unexpected article file');
           $rows=loadj('articles.json');$before=$rows;
           $keys=array_keys(array_filter($rows,fn($r)=>(int)$r['id']===121));
           if(count($keys)!==1)throw new RuntimeException('Article identity mismatch');
           $k=$keys[0];$row=$rows[$k];
           if($row['title']!=='加圧トレーニングと肌の関係｜運動習慣と美肌について')throw new RuntimeException('Title mismatch');
           $old='今回はこの感想をきっかけに、運動と美肌の関係と運動習慣について、研究で分かっていることと、まだ分かっていないことを整理してお伝えします。';$new='今回は、運動が肌の健康にどのように関わるのか、研究結果をもとに解説します。';
           if(substr_count($row['body'],$old)===1)$row['body']=str_replace($old,$new,$row['body']);
           elseif(substr_count($row['body'],$old)===0&&substr_count($row['body'],$new)===1){}
           else throw new RuntimeException('Unexpected lead wording');
           $plain=preg_replace('/\s+/u','',strip_tags(preg_replace('/<h2>.*?<\/h2>/s','',explode('<h2>参考文献・関連資料</h2>',$row['body'],2)[0])));
           if(!is_string($plain)||mb_strlen($plain,'UTF-8')<3000)throw new RuntimeException('Article length below minimum');
           $backup=tempnam(DATA,'before-skin-lead-');if(!$backup||!copy(DATA.'articles.json',$backup)||!chmod($backup,0600))throw new RuntimeException('Backup failed');
           $rows[$k]=$row;
           try{writej('articles.json',$rows);if(loadj('articles.json')!==$rows)throw new RuntimeException('Verification failed');}catch(Throwable $e){writej('articles.json',$before);throw $e;}
           echo 'PASS: only requested sentence in article 121 updated; all other data unchanged.'.PHP_EOL;
           echo 'TEXT_LENGTH='.mb_strlen($plain,'UTF-8').PHP_EOL;
          }finally{flock($lock,LOCK_UN);fclose($lock);}
          
          PHP
          php -l "$T/revise.php"
          php "$T/revise.php"
          REMOTE
      - name: Verify public article
        run: |
          set -eu
          curl -fsSL --max-time 30 'https://rakudadou.sakura.ne.jp/hope-blog/blog-entry-121.html' -o /tmp/article.html
          grep -Fq '今回は、運動が肌の健康にどのように関わるのか、研究結果をもとに解説します。' /tmp/article.html
          if grep -Fq '今回はこの感想をきっかけに、運動と美肌の関係と運動習慣について、研究で分かっていることと、まだ分かっていないことを整理してお伝えします。' /tmp/article.html; then exit 1; fi
          echo 'PASS: revised public sentence verified.'
