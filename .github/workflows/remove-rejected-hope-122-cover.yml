name: Remove rejected HOPE 122 cover
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-rejected-hope-122-cover.yml']
permissions:
  contents: read
concurrency:
  group: hope-blog-production-host
  cancel-in-progress: false
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove rejected cover only and verify saved article
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null
          ssh-keyscan -T 10 -H "$SAKURA_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" 'sh -s' <<'REMOTE'
          set -eu
          D=/home/rakudadou/hope-blog-private/data
          T=$(mktemp -d "$D/remove-cover.XXXXXXXX")
          trap 'rm -rf "$T"' EXIT
          cat > "$T/remove.php" <<'PHP'
          <?php
          $_SERVER['SCRIPT_NAME']='/hope-blog/index.php';
          require '/home/rakudadou/www/hope-blog/common.php';
          if(realpath(DATA)!=='/home/rakudadou/hope-blog-private/data')throw new RuntimeException('Data mismatch');
          $lock=fopen(DATA.'write.lock','c');if(!$lock||!flock($lock,LOCK_EX))throw new RuntimeException('Lock failed');
          try{
            $rows=loadj('articles.json');$before=$rows;
            $keys=array_keys(array_filter($rows,fn($r)=>(int)$r['id']===122));
            if(count($keys)!==1)throw new RuntimeException('Article mismatch');
            $k=$keys[0];$row=$rows[$k];
            if($row['title']!=='加圧トレーニングで美肌は期待できる？｜運動と肌の健康の関係')throw new RuntimeException('Title mismatch');
            $url='/hope-blog/assets/hope-blog-images/hope-122-real-equipment.jpg';
            foreach(['image','eyecatch'] as $f){if(!in_array(($row[$f]??''),['',$url],true))throw new RuntimeException('Unexpected cover field '.$f);$row[$f]='';}
            if(($row['eyecatch_alt']??'')==='HOPEの実際の加圧トレーニング専用器具')$row['eyecatch_alt']='';
            $backup=tempnam(DATA,'before-remove-rejected-cover-122-');if(!$backup||!copy(DATA.'articles.json',$backup)||!chmod($backup,0600))throw new RuntimeException('Backup failed');
            $rows[$k]=$row;
            try{writej('articles.json',$rows);if(loadj('articles.json')!==$rows)throw new RuntimeException('Readback mismatch');}catch(Throwable $e){writej('articles.json',$before);throw $e;}
            echo 'PASS: rejected cover removed; article text and other articles unchanged.'.PHP_EOL;
          }finally{flock($lock,LOCK_UN);fclose($lock);}
          PHP
          php -l "$T/remove.php"
          php "$T/remove.php"
          REMOTE
      - name: Verify public pages
        run: |
          set -eu
          for page in blog-entry-122.html ''; do
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "https://rakudadou.sakura.ne.jp/hope-blog/$page" -o /tmp/hope-page.html
            if grep -Fq 'hope-122-real-equipment.jpg' /tmp/hope-page.html; then echo "Rejected image still present"; exit 1; fi
            if [ "$page" = blog-entry-122.html ]; then
              grep -Fq 'hope-122-toc' /tmp/hope-page.html
              grep -Fq 'hope-122-rule' /tmp/hope-page.html
            fi
            echo "PASS public page: ${page:-home}"
          done
