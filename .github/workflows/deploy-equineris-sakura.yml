name: Deploy EQUINERIS to Sakura
# GitHub main is the source of truth. Only verified commits can reach Sakura.
on:
  push:
    branches: [main]
    paths:
      - 'equineris/**'
      - 'food-search.html'
      - 'food-master.json'
      - 'nutrient-food-search.html'
      - 'nutrient-master.json'
      - 'nutrient-panel.js'
      - 'program.css'
      - '.github/workflows/deploy-equineris-sakura.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-equineris-sakura
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all required deployment files
        run: |
          test -s equineris/index.html
          for file in food-search.html food-master.json nutrient-food-search.html nutrient-master.json nutrient-panel.js program.css; do
            test -s "$file" || { echo "::error::Missing dependency: $file"; exit 1; }
          done
      - name: Test page syntax, links, food diary and learning controls
        run: node equineris/tests/flow-check.cjs
      - name: Test textbook and navigation in browser
        run: node equineris/tests/reader-browser.cjs
      - name: Test responsive layouts and buttons
        run: node equineris/tests/mobile-layout-audit.cjs
      - name: Test trainer-review API, authentication and private photos
        run: |
          php -l equineris/api/review.php
          node --check equineris/trainer-check.js
          node --check equineris/trainer-dashboard.js
          node --check equineris/trainer-link.js
          python -m pip install --disable-pip-version-check -q requests pillow
          python tests/api-integration.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSH configuration
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          test -n "$SSH_KEY" || { echo "SAKURA_SSH_KEY missing"; exit 1; }
          test -n "$SAKURA_HOST" || { echo "SAKURA_HOST missing"; exit 1; }
          test -n "$SAKURA_USER" || { echo "SAKURA_USER missing"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          chmod 600 ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null 2>&1 || {
            echo "::error::SAKURA_SSH_KEY is not a valid private key"
            exit 1
          }
          ssh-keyscan -T 10 -H "$SAKURA_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: Back up live files outside the public directory
        env:
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes "$SAKURA_USER@$SAKURA_HOST" \
            'set -eu
             cd /home/rakudadou/www/smart-diet
             test -d equineris
             mkdir -p /home/rakudadou/equineris-deploy-backups
             set -- equineris
             for file in food-search.html food-master.json nutrient-food-search.html nutrient-master.json nutrient-panel.js program.css; do
               if test -f "$file"; then set -- "$@" "$file"; fi
             done
             tar -czf "/home/rakudadou/equineris-deploy-backups/predeploy-$(date +%Y%m%d-%H%M%S).tar.gz" "$@"
             echo "Sakura backup finished"'
      - name: Upload only EQUINERIS and its verified shared files
        env:
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          scp -i ~/.ssh/id_sakura -o BatchMode=yes -r equineris/. \
            "$SAKURA_USER@$SAKURA_HOST:/home/rakudadou/www/smart-diet/equineris/"
          scp -i ~/.ssh/id_sakura -o BatchMode=yes food-search.html food-master.json nutrient-food-search.html nutrient-master.json nutrient-panel.js program.css \
            "$SAKURA_USER@$SAKURA_HOST:/home/rakudadou/www/smart-diet/"
          echo "Sakura upload finished"
      - name: Provision trainer password only from the GitHub Actions secret
        env:
          TRAINER_PASSWORD: ${{ secrets.EQUINERIS_TRAINER_PASSWORD }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          if test -z "$TRAINER_PASSWORD"; then
            echo "Trainer review remains disabled until the password secret is configured"
            exit 0
          fi
          test "${#TRAINER_PASSWORD}" -ge 16 || {
            echo "::error::Trainer password must be at least 16 characters"
            exit 1
          }
          umask 077
          CONFIG_FILE=$(mktemp)
          trap 'rm -f "$CONFIG_FILE"' EXIT
          printf '%s' "$TRAINER_PASSWORD" | php -r '
            $password = stream_get_contents(STDIN);
            if (strlen($password) < 16) exit(1);
            $hash = password_hash($password, PASSWORD_DEFAULT);
            echo "<?php return [".var_export("trainer_password_hash",true)." => ".var_export($hash,true)."];\n";
          ' > "$CONFIG_FILE"
          php -l "$CONFIG_FILE"
          scp -i ~/.ssh/id_sakura -o BatchMode=yes "$CONFIG_FILE" \
            "$SAKURA_USER@$SAKURA_HOST:/home/rakudadou/www/smart-diet/equineris/api/config.local.php"
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes "$SAKURA_USER@$SAKURA_HOST" \
            'chmod 600 /home/rakudadou/www/smart-diet/equineris/api/config.local.php'
      - name: Verify uploaded files on Sakura
        env:
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes "$SAKURA_USER@$SAKURA_HOST" \
            'set -eu
             cd /home/rakudadou/www/smart-diet
             test -s equineris/index.html
             test -s equineris/learning.html
             test -s equineris/food-groups.html
             for file in food-search.html food-master.json nutrient-food-search.html nutrient-master.json nutrient-panel.js program.css; do test -s "$file"; done
             echo "Sakura files verified"'
      - name: Verify trainer PHP endpoint status without exposing credentials
        run: |
          OUTPUT=$(curl --fail --silent --show-error --location --max-time 20 \
            "https://rakudadou.sakura.ne.jp/smart-diet/equineris/api/review.php?action=status")
          printf '%s' "$OUTPUT" | php -r '
            $payload=json_decode(stream_get_contents(STDIN),true);
            if (!is_array($payload)||!isset($payload["configured"])||!is_bool($payload["configured"])) exit(1);
            echo "Trainer-review API reachable; configured=" . ($payload["configured"]?"true":"false") . "\n";
          '
      - name: Verify public URLs over HTTPS
        run: |
          for path in \
            equineris/index.html \
            equineris/learning.html \
            equineris/food-groups.html \
            food-search.html \
            nutrient-food-search.html; do
            curl --fail --silent --show-error --location --max-time 20 --retry 2 \
              --output /dev/null "https://rakudadou.sakura.ne.jp/smart-diet/$path" || {
                echo "::error::Public URL did not pass: $path"
                exit 1
              }
          done
          echo "Sakura HTTPS pages verified"
