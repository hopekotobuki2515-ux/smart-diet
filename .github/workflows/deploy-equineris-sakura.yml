name: Deploy EQUINERIS to Sakura
# Sakura deployment runs only on explicit manual action, never on a code push.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-equineris-sakura
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSH configuration
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          test -n "$SSH_KEY" || { echo "SAKURA_SSH_KEY missing"; exit 1; }
          test -n "$SAKURA_HOST" || { echo "SAKURA_HOST missing"; exit 1; }
          test -n "$SAKURA_USER" || { echo "SAKURA_USER missing"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Accept a normal multiline key, CRLF key, or a key saved with literal \n sequences.
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          chmod 600 ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null 2>&1 || {
            echo "::error::SAKURA_SSH_KEY is not a valid private key after newline normalization"
            exit 1
          }
          ssh-keyscan -T 10 -H "$SAKURA_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: Upload EQUINERIS files without deleting server files
        env:
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes "$SAKURA_USER@$SAKURA_HOST" 'test -d /home/rakudadou/www/smart-diet/equineris'
          scp -i ~/.ssh/id_sakura -o BatchMode=yes -r equineris/. "$SAKURA_USER@$SAKURA_HOST:/home/rakudadou/www/smart-diet/equineris/"
          echo "Sakura upload finished"
