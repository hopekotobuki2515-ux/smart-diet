name: Set HOPE article 122 eyecatch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/set-hope-skin-eyecatch-122-20261128.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hope-blog-production-host
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve and validate original PNG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          curl -fsSL --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/hopekotobuki2515-ux/smart-diet/git/blobs/17fa18a55d219610336ad081547a75caca58099e' -o /tmp/hope-image.json
          python - <<'PY'
          import json,base64,struct
          j=json.load(open('/tmp/hope-image.json'))
          b=base64.b64decode(j['content'])
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',b[16:24])==(1536,1024)
          assert len(b)==2039201
          open('/tmp/hope-eyecatch.png','wb').write(b)
          PY
          test "$(git hash-object /tmp/hope-eyecatch.png)" = '17fa18a55d219610336ad081547a75caca58099e'
          sha256sum /tmp/hope-eyecatch.png
      - name: Upload unchanged image and set article image
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null
          ssh-keyscan -T 10 -H "$SAKURA_HOST" > ~/.ssh/known_hosts
          remote='set -eu; P=/home/rakudadou/www/hope-blog/assets/hope-blog-images; test -d "$P"; T=$(mktemp "$P/.image.XXXXXXXX"); cat > "$T"; test "$(wc -c < "$T" | tr -d " ")" = 2039201; chmod 644 "$T"; if test -e "$P/17fa18a55d219610336ad081547a75caca58099ea11ce122.png"; then cmp "$T" "$P/17fa18a55d219610336ad081547a75caca58099ea11ce122.png"; rm "$T"; else mv "$T" "$P/17fa18a55d219610336ad081547a75caca58099ea11ce122.png"; fi'
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" "sh -c '$remote'" < /tmp/hope-eyecatch.png
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" 'sh -s' <<'REMOTE'
          set -eu
          D=/home/rakudadou/hope-blog-private/data
          T=$(mktemp -d "$D/skin-eyecatch.XXXXXXXX")
          trap 'rm -rf "$T"' EXIT
          cat > "$T/set.php" <<'PHP'
          <?php
          declare(strict_types=1);
          $_SERVER['SCRIPT_NAME']='/hope-blog/index.php';
          require '/home/rakudadou/www/hope-blog/common.php';
          if(realpath(DATA)!=='/home/rakudadou/hope-blog-private/data')throw new RuntimeException('Unexpected DATA location');
          $name='17fa18a55d219610336ad081547a75caca58099ea11ce122.png';$url=url('assets/hope-blog-images/'.$name);
          if($url!=='/hope-blog/assets/hope-blog-images/17fa18a55d219610336ad081547a75caca58099ea11ce122.png')throw new RuntimeException('Image URL mismatch');
          $file='/home/rakudadou/www/hope-blog/assets/hope-blog-images/'.$name;
          $im=getimagesize($file);
          if(!$im||$im[0]!==1536||$im[1]!==1024||$im[2]!==IMAGETYPE_PNG)throw new RuntimeException('Invalid image');
          $lock=fopen(DATA.'write.lock','c');if(!$lock||!flock($lock,LOCK_EX))throw new RuntimeException('Lock failed');
          try{
           $rows=loadj('articles.json');$before=$rows;
           $keys=array_keys(array_filter($rows,fn($r)=>(int)$r['id']===122));
           if(count($keys)!==1)throw new RuntimeException('Article identity mismatch');
           $k=$keys[0];$row=$rows[$k];
           if($row['title']!=='加圧トレーニングで美肌は期待できる？｜運動と肌の健康の関係')throw new RuntimeException('Title mismatch');
           foreach(['image','eyecatch'] as $f){if(!in_array((string)($row[$f]??''),['',$url],true))throw new RuntimeException('Existing image differs');}
           $row['image']=$url;$row['eyecatch']=$url;$row['eyecatch_alt']='加圧トレーニングと美肌、運動と肌の健康の関係';
           $backup=tempnam(DATA,'before-skin-eyecatch-');if(!$backup||!copy(DATA.'articles.json',$backup)||!chmod($backup,0600))throw new RuntimeException('Backup failed');
           $rows[$k]=$row;
           try{writej('articles.json',$rows);if(loadj('articles.json')!==$rows)throw new RuntimeException('Verification failed');}catch(Throwable $e){writej('articles.json',$before);throw $e;}
           echo 'PASS: article 122 image fields only; all other data unchanged.'.PHP_EOL;
          }finally{flock($lock,LOCK_UN);fclose($lock);}
          
          PHP
          php -l "$T/set.php"
          php "$T/set.php"
          REMOTE
      - name: Verify public image, article and listing
        run: |
          set -eu
          curl -fsSL --max-time 30 'https://rakudadou.sakura.ne.jp/hope-blog/assets/hope-blog-images/17fa18a55d219610336ad081547a75caca58099ea11ce122.png' -o /tmp/live-image.png
          cmp /tmp/hope-eyecatch.png /tmp/live-image.png
          curl -fsSL --max-time 30 'https://rakudadou.sakura.ne.jp/hope-blog/blog-entry-122.html' -o /tmp/article.html
          curl -fsSL --max-time 30 'https://rakudadou.sakura.ne.jp/hope-blog/' -o /tmp/home.html
          python - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.img=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='img': self.img.append(dict(attrs))
          a=P();a.feed(open('/tmp/article.html').read())
          h=P();h.feed(open('/tmp/home.html').read())
          target='/hope-blog/assets/hope-blog-images/17fa18a55d219610336ad081547a75caca58099ea11ce122.png'
          assert any(x.get('src','').endswith(target) and x.get('alt') for x in a.img), 'Article cover missing'
          assert any(x.get('src','').endswith(target) for x in h.img), 'Listing cover missing'
          print('PASS: original image bytes, article cover, alt and home listing verified.')
          PY
