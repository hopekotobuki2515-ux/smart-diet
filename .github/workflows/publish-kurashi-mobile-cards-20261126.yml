name: Publish Kurashi mobile swipeable product cards
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-kurashi-mobile-cards-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kurashi-copy-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate and prepare from actual live pages
        run: python3 kurashi-mobile-cards-20261126/apply.py prepare
      - name: Install browser check
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Verify product carousel and desktop layout before publication
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const path=require('path');
          (async()=>{
            const root=path.join(process.env.RUNNER_TEMP,'kurashi-copy-update');
            const manifest=JSON.parse(fs.readFileSync(path.join(root,'manifest.json'),'utf8'));
            const targets=Object.entries(manifest).filter(([k])=>k.startsWith('genre-')||k==='self.html');
            if(targets.length!==16)throw Error('wrong page count');
            const browser=await chromium.launch({headless:true});
            try {
              for(const width of [320,390,720,1366]){
                const mobile=width<=720;
                const context=await browser.newContext({viewport:{width,height:844},isMobile:mobile,hasTouch:mobile,reducedMotion:'reduce'});
                await context.route('**/*',async r=>{
                  const target=targets.find(([,v])=>decodeURI(v.url)===decodeURI(r.request().url()));
                  if(target && r.request().resourceType()==='document')return r.fulfill({status:200,contentType:'text/html; charset=utf-8',body:fs.readFileSync(path.join(root,'public',target[1].path))});
                  return r.abort();
                });
                for(const [name,v] of targets){
                  const page=await context.newPage();
                  await page.goto(v.url,{waitUntil:'domcontentloaded',timeout:15000});
                  const results=await page.evaluate(async mobile=>{
                    const grids=[...document.querySelectorAll('.product-section > .product-grid')],results=[];
                    const wait=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
                    for(const g of grids){
                      const cards=[...g.querySelectorAll(':scope > .product-card')];
                      if(!cards.length)throw Error('empty grid');
                      const cs=getComputedStyle(g), rect=g.getBoundingClientRect();
                      const initial=cards[0].getBoundingClientRect();
                      const res={count:cards.length,client:g.clientWidth,scrollWidth:g.scrollWidth,card:initial.width,overflow:document.documentElement.scrollWidth>innerWidth+1,viewport:innerWidth,gridInside:rect.left>=-1&&rect.right<=innerWidth+1,snap:cs.scrollSnapType,all50:[...g.querySelectorAll('.product-description')].every(e=>Array.from(e.textContent.replace(/\s/g,'')).length===50)};
                      if(mobile){
                        if(cards.length>1){g.scrollLeft=cards[1].offsetLeft-cards[0].offsetLeft;await wait();res.next=Math.abs(cards[1].getBoundingClientRect().left-g.getBoundingClientRect().left)<=2;}else res.next=true;
                        g.scrollLeft=g.scrollWidth;await wait();
                        res.last=Math.abs(cards[cards.length-1].getBoundingClientRect().left-g.getBoundingClientRect().left)<=2;
                        g.scrollLeft=0;await wait();
                        res.reset=Math.abs(cards[0].getBoundingClientRect().left-g.getBoundingClientRect().left)<=2;
                        res.sameWidth=cards.every(c=>Math.abs(c.getBoundingClientRect().width-g.clientWidth)<=1);
                        res.fit=cards.every(c=>c.scrollWidth<=c.clientWidth+1);
                      } else {
                        res.threeColumns=cs.gridTemplateColumns.split(' ').length===3 && (cards.length<3 || cards[0].getBoundingClientRect().top===cards[2].getBoundingClientRect().top) && (cards.length<2 || cards[1].getBoundingClientRect().left>cards[0].getBoundingClientRect().left) && (cards.length<4 || cards[3].getBoundingClientRect().top>cards[0].getBoundingClientRect().top);
                      }
                      results.push(res);
                    }
                    return results;
                  },mobile);
                  if(!results.length || (name==='self.html'?results.length<2:results.length!==1))throw Error('Wrong number of product grids');
                  console.log('DISPLAY',width,name,JSON.stringify(results));
                  for(const result of results)if(result.overflow||!result.gridInside||!result.all50||(mobile?!(result.sameWidth&&result.fit&&result.next&&result.last&&result.reset&&result.snap.includes('mandatory')&&(result.count===1||result.scrollWidth>result.client)):!result.threeColumns))throw Error('Layout validation failed: '+width+' '+name+' '+JSON.stringify(result));
                  await page.close();
                }
                await context.close();
              }
            } finally {await browser.close()}
            console.log('PASS: all 16 product pages at 320, 390, 720 and 1366px; one full-width mobile card, scroll to next/last/back, desktop 3 columns, no document overflow');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Publish only validated HTML changes with backup
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          set -eu
          root="$RUNNER_TEMP/kurashi-copy-update"
          if ! test -s "$root/changes.txt"; then echo "Already current, no deployment necessary"; exit 0; fi
          test -n "$SSH_KEY" && test -n "$SAKURA_HOST" && test -n "$SAKURA_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          chmod 600 ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null
          ssh-keyscan -T 10 -H "$SAKURA_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          tar -czf "$RUNNER_TEMP/kurashi-copy-update.tar.gz" -C "$root" changes.txt original public
          remote=$(cat <<'REMOTE'
          sh -c 'set -eu; dest=/home/rakudadou/www/kurashi; test -d "$dest"; test ! -L "$dest"; stage=$(mktemp -d /home/rakudadou/kurashi-copy-stage.XXXXXXXX); backup=""; committed=0; rollback() { status=$?; if test "$committed" -eq 1 && test "$status" -ne 0; then while IFS= read -r rel; do cp -p "$backup/$rel" "$dest/$rel" || echo "ROLLBACK FAILED: $rel" >&2; done < "$stage/changes.txt"; fi; rm -rf "$stage"; exit "$status"; }; trap rollback 0; tar -xzf - -C "$stage"; test -s "$stage/changes.txt"; while IFS= read -r rel; do case "$rel" in */index.html) ;; *) exit 1;; esac; case "$rel" in /*|*..*|*//* ) exit 1;; esac; dir=$(dirname "$rel"); test -d "$dest/$dir"; test ! -L "$dest/$dir"; test -f "$dest/$rel"; test ! -L "$dest/$rel"; test -s "$stage/public/$rel"; cmp "$stage/original/$rel" "$dest/$rel"; done < "$stage/changes.txt"; backup=$(mktemp -d /home/rakudadou/kurashi-copy-backup.XXXXXXXX); chmod 700 "$backup"; while IFS= read -r rel; do mkdir -p "$backup/$(dirname "$rel")"; cp -p "$dest/$rel" "$backup/$rel"; done < "$stage/changes.txt"; committed=1; while IFS= read -r rel; do tmp=$(mktemp "$dest/$(dirname "$rel")/.copy-update.XXXXXXXX"); cp -p "$dest/$rel" "$tmp"; cat "$stage/public/$rel" > "$tmp"; mv -f "$tmp" "$dest/$rel"; cmp "$stage/public/$rel" "$dest/$rel"; echo "INSTALLED: $rel"; done < "$stage/changes.txt"; committed=0; echo "PASS: exact live source match, backup outside web root, verified server files"'
          REMOTE
          )
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" "$remote" < "$RUNNER_TEMP/kurashi-copy-update.tar.gz"
      - name: Verify all public HTML pages, sitemap and local images
        run: python3 kurashi-mobile-cards-20261126/apply.py verify
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kurashi-copy-update-evidence
          path: |
            ${{ runner.temp }}/kurashi-copy-update/manifest.json
            ${{ runner.temp }}/kurashi-copy-update/changes.txt
          if-no-files-found: ignore
          retention-days: 30

# Mobile product grid only; preserve desktop and all article and product content.
