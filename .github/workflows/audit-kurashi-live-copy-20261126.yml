name: Audit current Kurashi product cards without writes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-kurashi-live-copy-20261126.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read public site and inspect exact product card structure
        run: |
          python3 - <<'PY'
          import sys,json,collections,re
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          sys.path.insert(0,'kurashi-copy-update-20261126')
          import apply as a
          data=a.DATA
          with ThreadPoolExecutor(max_workers=5) as ex: raw=dict(zip(a.mapping,ex.map(lambda x:a.fetch(a.url(x)).decode(),a.mapping)))
          found=collections.Counter();allcards={};examples={};links={}
          for page,s in raw.items():
              cards=list(a.CARD.finditer(s));print('PAGE',page,len(cards),len(a.DESC.findall(s)),flush=True)
              for m in cards:
                  id=m.group(1);card=m.group(0);ds=list(a.DESC.finditer(card));names=re.findall(r'<h3[^>]*>(.*?)</h3>',card,re.S)
                  assert len(names)==1,(page,id,names)
                  name=a.text(names[0]);item=data['products'].get(id)
                  hrefs=re.findall(r'\bhref="([^"]+)"',card)
                  if page not in examples:examples[page]=card
                  if not ds:
                      if page!='self.html': print('MISSING_DESC',page,id,card)
                      continue
                  assert len(ds)==1,(page,id)
                  desc=a.text(ds[0].group(2));found[id]+=1
                  allcards[id]={'page':page,'id':id,'name':name,'description':desc,'links':hrefs}
                  if not item or name!=item['name'] or page!=item['page']:
                      print('DIFFERENT',json.dumps(allcards[id],ensure_ascii=False))
                  print('PRODUCT',json.dumps(allcards[id],ensure_ascii=False))
          print('EXAMPLE_SELF',examples.get('self.html',''))
          print('SUMMARY',json.dumps({'unique':len(found),'occurrences':sum(found.values()),'missing_old':sorted(set(data['products'])-set(found)),'new':sorted(set(found)-set(data['products']))},ensure_ascii=False))
          PY
