name: Persist restored goals

on:
  push:
    paths:
      - .github/workflows/apply-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save restored goals to Firebase
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '$$(".restoreGoal").forEach(btn=>{btn.onclick=()=>{const id=btn.dataset.id,completed=get("completedGoals",[]).filter(x=>x!==id);set("completedGoals",completed);const goals=get("goals",[]);if(!goals.includes(id)&&goals.length<3)goals.push(id);set("goals",goals);const logs=get("logs",{});getRecentDates(day(),7).forEach(date=>{if(logs[date]?.[id])delete logs[date][id]});set("logs",logs);renderSettings();renderPicker();renderToday()}})'
          new = '$$(".restoreGoal").forEach(btn=>{btn.onclick=async()=>{const id=btn.dataset.id,completed=get("completedGoals",[]).filter(x=>x!==id);set("completedGoals",completed);const goals=get("goals",[]);if(!goals.includes(id)&&goals.length<3)goals.push(id);set("goals",goals);const logs=get("logs",{});getRecentDates(day(),7).forEach(date=>{if(logs[date]?.[id])delete logs[date][id]});set("logs",logs);await window.saveUserData();renderSettings();renderPicker();renderToday()}})'
          if old not in s:
              raise SystemExit('Expected restore-goal handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Persist restored goals"
          git push
