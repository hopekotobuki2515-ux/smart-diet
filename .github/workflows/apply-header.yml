name: Remove header logo

on:
  push:
    paths:
      - .github/workflows/apply-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove logo from app header
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.headerInner{position:relative;z-index:1;max-width:760px;margin:0 auto}.brandLogoWrap{display:inline-flex;align-items:center;justify-content:center;min-width:122px;min-height:54px;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 4px 12px rgba(120,55,0,.14)}.brandLogo{display:block;width:108px;max-width:32vw;height:auto}header h1{margin:9px 0 4px;font-size:clamp(26px,6.8vw,38px);line-height:1.2;letter-spacing:.01em}'
          new_css = '.headerInner{position:relative;z-index:1;max-width:760px;margin:0 auto}header h1{margin:0 0 4px;font-size:clamp(26px,6.8vw,38px);line-height:1.2;letter-spacing:.01em}'
          if old_css not in s:
              raise SystemExit('Expected header CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_html = '<div id="appArea" class="hidden"><header><div class="headerInner"><div class="brandLogoWrap"><img class="brandLogo" src="assets/hope-logo.png" alt="加圧パーソナルエクササイズスタジオHOPE"></div><h1>まずは、食習慣から。</h1><p class="brandSubtitle">ダイエットの土台をつくる食習慣改善ナビゲーションアプリ</p><div class="headerGuide">初めての方は「設定」から始めてください</div></div></header><main>'
          new_html = '<div id="appArea" class="hidden"><header><div class="headerInner"><h1>まずは、食習慣から。</h1><p class="brandSubtitle">ダイエットの土台をつくる食習慣改善ナビゲーションアプリ</p><div class="headerGuide">初めての方は「設定」から始めてください</div></div></header><main>'
          if old_html not in s:
              raise SystemExit('Expected header HTML not found')
          s = s.replace(old_html, new_html, 1)

          p.write_text(s, encoding='utf-8')

          logo = Path('assets/hope-logo.png')
          if logo.exists():
              logo.unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u assets
          git commit -m "Remove header logo"
          git push
