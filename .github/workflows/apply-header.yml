name: Center initial setup button

on:
  push:
    paths:
      - .github/workflows/apply-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center and tighten initial setup card
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '.foodCategory{border:1px solid #e5e5e5;border-radius:16px;margin:12px 0;overflow:hidden;background:#fff;overflow-anchor:none}'
          extra = '#initialSetup>.card:has(#initialSetupContent.hidden){padding:10px 12px;text-align:center}#initialSetup>.card:has(#initialSetupContent.hidden) #toggleInitialSetup{display:block;margin:0 auto;padding:10px 18px;border:1px solid #ef6c00;background:#fff8f1;color:#ef6c00;font-weight:800}\n'
          if marker not in s:
              raise SystemExit('Expected CSS marker not found')
          if extra not in s:
              s = s.replace(marker, extra + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Center initial setup button"
          git push
