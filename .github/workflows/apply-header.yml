name: Fix intro line break

on:
  push:
    paths:
      - .github/workflows/apply-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten exercise sentence
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'すでに運動を続けている方にも、食べ方を整え、運動の効果をより活かすために使っていただけます。'
          new = '運動を続けている方にも、食べ方を整え、運動の効果をより活かすために使えます。'
          if old not in s:
              raise SystemExit('Expected sentence not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix intro line break"
          git push
