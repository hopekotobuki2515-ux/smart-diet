name: Audit public Rakudadou desktop site for AdSense
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-rakudadou-adsense.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Crawl public legacy HTML only and report actual pages
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, concurrent.futures, re, collections
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit, urldefrag
          hosts={'rakudadou.jp','www.rakudadou.jp'}
          excluded=('/hope-mobile/','/hope-blog/','/kurashi/','/equineris/','/smart-diet/')
          class P(HTMLParser):
              def __init__(self): super().__init__();self.links=[];self.imgs=[];self.frames=[];self.meta={};self.parts=[];self.skip=0;self.title='';self.in_title=False
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=='title':self.in_title=True
                  if t in ('script','style'):self.skip+=1
                  if t=='a' and a.get('href'):self.links.append(a['href'])
                  if t in ('frame','iframe') and a.get('src'):self.frames.append(a['src'])
                  if t=='img' and a.get('src'):self.imgs.append((a['src'],a.get('alt','')))
                  if t=='meta':self.meta[a.get('name','').lower()]=a.get('content','')
              def handle_endtag(self,t):
                  if t=='title':self.in_title=False
                  if t in ('script','style'):self.skip=max(0,self.skip-1)
              def handle_data(self,s):
                  if self.in_title:self.title+=s
                  if not self.skip and s.strip():self.parts.append(s.strip())
          def get(url,limit=2000000):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 HOPE site quality audit'})
                  with urllib.request.urlopen(req,timeout=10) as r:
                      raw=r.read(limit); charset=r.headers.get_content_charset()
                      return r.status,r.geturl(),r.headers,raw,charset
              except urllib.error.HTTPError as e:return e.code,url,e.headers,b'',None
              except Exception as e:return 0,url,{},b'',None
          for u in ['http://www.rakudadou.jp/','https://rakudadou.jp/','https://www.rakudadou.jp/','http://rakudadou.jp/robots.txt','https://rakudadou.jp/robots.txt','http://rakudadou.jp/ads.txt']:
              c,final,h,b,ch=get(u);print('CHECK',u,c,final,'robots',h.get('X-Robots-Tag',''),'content-type',h.get('Content-Type',''))
          c,final,h,raw,ch=get('https://www.rakudadou.jp/index.htm')
          root='https://www.rakudadou.jp/index.htm' if c==200 else 'http://www.rakudadou.jp/index.htm'
          def norm(base,x):
              u=urldefrag(urljoin(base,x))[0];v=urlsplit(u)
              if v.scheme not in ('http','https') or v.hostname not in hosts or any(v.path.startswith(p) for p in excluded) or v.query:return None
              if v.path=='/' or re.search(r'\.(?:html?|shtml)$',v.path,re.I):return urlsplit(root).scheme+'://www.rakudadou.jp'+v.path
              return None
          seen=set();queue=[root];rows=[];resources=set();bad=[]
          def read(u):
              c,final,h,raw,ch=get(u);p=P()
              if c==200:
                  s=None
                  for enc in [ch,'cp932','utf-8']:
                      if not enc:continue
                      try:s=raw.decode(enc);break
                      except (UnicodeError,LookupError):pass
                  if s is None:s=raw.decode('cp932','replace')
                  p.feed(s)
              return u,c,p
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:
              while queue and len(seen)<80:
                  batch=list(dict.fromkeys(u for u in queue if u not in seen))[:min(12,80-len(seen))];queue=[u for u in queue if u not in batch and u not in seen]
                  if not batch:break
                  seen.update(batch)
                  for u,c,p in ex.map(read,batch):
                      body=' '.join(p.parts)
                      print('PAGE',urlsplit(u).path,'HTTP',c,'TITLE',p.title.strip()[:130],'CHARS',len(body),'IMAGES',len(p.imgs),'NOALT',sum(not a for _,a in p.imgs),'FRAMES',len(p.frames),'ROBOTS',p.meta.get('robots',''))
                      if c==200:
                          print('TEXT',urlsplit(u).path,body[:1600])
                          for l in p.links+p.frames:
                              v=norm(u,l)
                              if v and v not in seen:queue.append(v)
                          for img,_ in p.imgs:
                              v=urljoin(u,img);q=urlsplit(v)
                              if q.hostname in hosts:resources.add(v)
                          rows.append((u,p.title,body))
                      else:bad.append((u,c))
              print('TOTAL',len(seen),'OK',len(rows),'FAILED',len(bad),'UNCRAWLED',len(set(queue)-seen))
              print('MISSING_PAGES',bad)
              print('POLICY_TITLE_MATCHES',[(urlsplit(u).path,t) for u,t,b in rows if re.search('プライバシー|個人情報|Privacy',t,re.I)])
              print('OPERATOR_TITLE_MATCHES',[(urlsplit(u).path,t) for u,t,b in rows if re.search('会社|店舗|プロフィール|代表|スタッフ|トレーナー|概要',t)])
              print('CONTACT_TITLE_MATCHES',[(urlsplit(u).path,t) for u,t,b in rows if re.search('問[い合]?[合わ]?せ|連絡|予約',t)])
              def check(u):
                  c,_,_,_,_=get(u,65536);return u,c
              imgresults=list(ex.map(check,sorted(resources)[:120]))
              print('IMAGE_CHECK',len(imgresults),'TOTAL_REFERENCES',len(resources),'BROKEN',[(urlsplit(u).path,c) for u,c in imgresults if c!=200])
          PY
