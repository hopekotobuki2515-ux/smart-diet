name: Publish HOPE mobile GA4 to Sakura
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hope-mobile-sakura.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-hope-mobile-sakura
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hopekotobuki2515-ux/hope-homepage
          ref: 70212d47fe19dd5eef559e7ab315332d9dbe6d87
          persist-credentials: false
      - name: Prepare unchanged public files
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/hope-site"
          test -s index.html
          test -d assets
          cp -a ./*.html ./*.pdf assets "$RUNNER_TEMP/hope-site/"
          if find "$RUNNER_TEMP/hope-site" -type l -print | grep -q .; then
            echo "Unexpected symbolic link; stopping"
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/hope-site.tar.gz" -C "$RUNNER_TEMP/hope-site" .
      - name: Update HTML in existing HOPE folder only
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          set -eu
          test -n "$SSH_KEY" && test -n "$SAKURA_HOST" && test -n "$SAKURA_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          chmod 600 ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null
          ssh-keyscan -T 10 -H "$SAKURA_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          remote=$(cat <<'REMOTE'
          sh -c 'set -eu; dest=/home/rakudadou/www/hope-mobile; test -d "$dest"; test ! -L "$dest"; stage=$(mktemp -d /home/rakudadou/hope-mobile-stage.XXXXXXXX); trap "rm -rf \"$stage\"" EXIT; tar -xzf - -C "$stage"; test -s "$stage/index.html"; for f in "$stage"/*.html; do n=$(basename "$f"); test -f "$dest/$n"; test ! -L "$dest/$n"; grep -Fq G-ZCETMLPKX3 "$f"; done; for f in "$stage"/*.html; do n=$(basename "$f"); cp -p "$f" "$dest/$n.ga4-new"; chmod a+r "$dest/$n.ga4-new"; mv -f "$dest/$n.ga4-new" "$dest/$n"; done; echo "HOPE HTML updated"'
          REMOTE
          )
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" "$remote" < "$RUNNER_TEMP/hope-site.tar.gz"
      - name: Verify public files on Sakura
        run: |
          set -eu
          base=https://rakudadou.sakura.ne.jp/hope-mobile
          for source in "$RUNNER_TEMP/hope-site/"*.html; do
            file=$(basename "$source")
            curl --fail --silent --show-error --max-time 30 "$base/$file" -o "$RUNNER_TEMP/hope-verify"
            cmp "$RUNNER_TEMP/hope-site/$file" "$RUNNER_TEMP/hope-verify"
          done
          echo "All HOPE public HTML files match GA4-enabled GitHub source"
