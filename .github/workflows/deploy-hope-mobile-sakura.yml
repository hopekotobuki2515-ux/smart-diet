name: Publish HOPE mobile SEO to Sakura
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hope-mobile-sakura.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-hope-mobile-sakura
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hopekotobuki2515-ux/hope-homepage
          ref: 33a8320f89cf6a252e12fbd4961cd2e1e890f439
          persist-credentials: false
      - name: Prepare and validate exact SEO files
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/hope-site"
          cp -p ./*.html .htaccess sitemap.xml "$RUNNER_TEMP/hope-site/"
          for d in '体験トレーニング' '加圧トレーニングの効果' 'パーソナルトレーニング料金' '入会案内' 'よくある質問' 'トレーナー紹介'; do
            test -s "$d/index.html"
            mkdir "$RUNNER_TEMP/hope-site/$d"
            cp -p "$d/index.html" "$RUNNER_TEMP/hope-site/$d/"
          done
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          from xml.etree import ElementTree
          root=Path.cwd()
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.canonical=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='canonical': self.canonical.append(a['href'])
                  for k in ('href','src','poster'):
                      if a.get(k): self.links.append(a[k])
          pages=[root/'index.html', *[p for p in root.glob('*/index.html') if p.parent.name in ['体験トレーニング','加圧トレーニングの効果','パーソナルトレーニング料金','入会案内','よくある質問','トレーナー紹介']]]
          assert len(pages)==7
          for p in pages:
              s=p.read_text()
              assert 'G-ZCETMLPKX3' in s, (p, 'GA4 missing')
              if 'tel:' in s: assert 'phone_click' in s, (p, 'phone tracking missing')
              parser=Links(); parser.feed(s)
              assert len(parser.canonical)==1 and parser.canonical[0].startswith('https://rakudadou.sakura.ne.jp/hope-mobile/')
              for link in parser.links:
                  u=urlsplit(link)
                  if u.scheme or u.netloc or not u.path: continue
                  t=p.parent/unquote(u.path)
                  if t.is_dir(): t=t/'index.html'
                  assert t.is_file(), (p,link)
          assert len(ElementTree.parse(root/'sitemap.xml').getroot())==7
          print('Seven SEO pages: GA4, canonical and relative links validated')
          PY
          cat > "$RUNNER_TEMP/hope-site/.htaccess.previous" <<'PREVIOUS'
          # HOPE mobile SEO routes only
          RewriteEngine On
          RewriteRule ^experience\.html$ /hope-mobile/%E4%BD%93%E9%A8%93%E3%83%88%E3%83%AC%E3%83%BC%E3%83%8B%E3%83%B3%E3%82%B0/ [R=301,L,NE]
          RewriteRule ^kaatsu\.html$ /hope-mobile/%E5%8A%A0%E5%9C%A7%E3%83%88%E3%83%AC%E3%83%BC%E3%83%8B%E3%83%B3%E3%82%B0%E3%81%AE%E5%8A%B9%E6%9E%9C/ [R=301,L,NE]
          RewriteRule ^pricing\.html$ /hope-mobile/%E3%83%91%E3%83%BC%E3%82%BD%E3%83%8A%E3%83%AB%E3%83%88%E3%83%AC%E3%83%BC%E3%83%8B%E3%83%B3%E3%82%B0%E6%96%99%E9%87%91/ [R=301,L,NE]
          RewriteRule ^membership\.html$ /hope-mobile/%E5%85%A5%E4%BC%9A%E6%A1%88%E5%86%85/ [R=301,L,NE]
          RewriteRule ^faq\.html$ /hope-mobile/%E3%82%88%E3%81%8F%E3%81%82%E3%82%8B%E8%B3%AA%E5%95%8F/ [R=301,L,NE]
          RewriteRule ^profile\.html$ /hope-mobile/%E3%83%88%E3%83%AC%E3%83%BC%E3%83%8A%E3%83%BC%E7%B4%B9%E4%BB%8B/ [R=301,L,NE]
          PREVIOUS
          tar -czf "$RUNNER_TEMP/hope-site.tar.gz" -C "$RUNNER_TEMP/hope-site" .
      - name: Deploy only HOPE with guarded backup
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          set -eu
          test -n "$SSH_KEY" && test -n "$SAKURA_HOST" && test -n "$SAKURA_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          chmod 600 ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null
          ssh-keyscan -T 10 -H "$SAKURA_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          remote=$(cat <<'REMOTE'
          sh -c 'set -eu; dest=/home/rakudadou/www/hope-mobile; test -d "$dest"; test ! -L "$dest"; stage=$(mktemp -d /home/rakudadou/hope-seo-stage.XXXXXXXX); trap "rm -rf \"$stage\"" EXIT; tar -xzf - -C "$stage"; test -s "$stage/index.html"; test -s "$stage/.htaccess"; for f in "$stage"/*.html; do n=$(basename "$f"); test -f "$dest/$n"; test ! -L "$dest/$n"; grep -Fq G-ZCETMLPKX3 "$f"; done; for d in "$stage"/*/; do n=$(basename "$d"); test -s "$d/index.html"; if test -e "$dest/$n" || test -L "$dest/$n"; then test -d "$dest/$n"; test ! -L "$dest/$n"; test -f "$dest/$n/index.html"; test ! -L "$dest/$n/index.html"; cmp -s "$d/index.html" "$dest/$n/index.html" || { echo "Existing alias differs; stopping"; exit 1; }; fi; done; for n in .htaccess sitemap.xml; do if test -e "$dest/$n" || test -L "$dest/$n"; then test -f "$dest/$n"; test ! -L "$dest/$n"; cmp -s "$stage/$n" "$dest/$n" || { test "$n" = .htaccess && cmp -s "$stage/.htaccess.previous" "$dest/$n"; } || { echo "Existing $n differs; stopping before write"; exit 1; }; fi; done; backup=$(mktemp -d /home/rakudadou/hope-seo-backup.XXXXXXXX); chmod 700 "$backup"; for f in "$stage"/*.html; do n=$(basename "$f"); cp -p "$dest/$n" "$backup/$n"; done; for n in .htaccess sitemap.xml; do if test -f "$dest/$n"; then cp -p "$dest/$n" "$backup/$n"; fi; done; for d in "$stage"/*/; do n=$(basename "$d"); if test ! -d "$dest/$n"; then mkdir -m 755 "$dest/$n"; cp -p "$d/index.html" "$dest/$n/index.html"; chmod a+r "$dest/$n/index.html"; fi; done; for f in "$stage"/*.html; do n=$(basename "$f"); cp -p "$f" "$dest/$n.seo-new"; chmod a+r "$dest/$n.seo-new"; mv -f "$dest/$n.seo-new" "$dest/$n"; done; cp -p "$stage/sitemap.xml" "$dest/sitemap.xml.seo-new"; chmod a+r "$dest/sitemap.xml.seo-new"; mv -f "$dest/sitemap.xml.seo-new" "$dest/sitemap.xml"; cp -p "$stage/.htaccess" "$dest/.htaccess.seo-new"; chmod a+r "$dest/.htaccess.seo-new"; mv -f "$dest/.htaccess.seo-new" "$dest/.htaccess"; echo "HOPE SEO files deployed; backup stored outside public root"'
          REMOTE
          )
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" "$remote" < "$RUNNER_TEMP/hope-site.tar.gz"
      - name: Verify live Japanese URLs and 301 redirects
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote, unquote, urlsplit, urljoin
          from urllib.request import build_opener, HTTPRedirectHandler, urlopen
          from urllib.error import HTTPError
          from html.parser import HTMLParser
          base='https://rakudadou.sakura.ne.jp/hope-mobile/'
          mapping={'experience.html':'体験トレーニング','kaatsu.html':'加圧トレーニングの効果','pricing.html':'パーソナルトレーニング料金','membership.html':'入会案内','faq.html':'よくある質問','profile.html':'トレーナー紹介'}
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          op=build_opener(NoRedirect())
          def check(url,path):
              with urlopen(url,timeout=20) as r:
                  assert r.status==200, (url,r.status)
                  assert r.read()==Path(path).read_bytes(), (url,'content mismatch')
              print('HTTP 200 and exact source match:',url)
          check(base,'index.html')
          check(base+'sitemap.xml','sitemap.xml')
          for old,slug in mapping.items():
              new=base+quote(slug)+'/'
              check(new,slug+'/index.html')
              try:
                  with op.open(base+old,timeout=20) as r:
                      raise AssertionError((old,'expected 301',r.status))
              except HTTPError as e:
                  assert e.code==301,(old,e.code)
                  actual=urljoin(base+old,e.headers['Location'])
                  assert unquote(actual)==unquote(new),(old,actual,new)
                  print('301 verified:',old,'->',new)
          check(base+'taiken.html','taiken.html')
          check(base+'sato-12-weeks.html','sato-12-weeks.html')
          for asset in ['assets/experience-trial-photo.webp','assets/taiken_photo_2.png','assets/taiken_photo_3.png','assets/trial-training-collage.jpg','assets/training_kaatsu.png','assets/kaatsu-training-studio.jpg']:
              check(base+asset,asset)
          print('All Japanese pages, old redirects, GA4 source and selected images passed')
          PY
