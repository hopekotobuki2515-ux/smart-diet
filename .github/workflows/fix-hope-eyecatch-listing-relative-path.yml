name: Show saved local eyecatches in HOPE home cards
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-hope-eyecatch-listing-relative-path.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hope-blog-production-host
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allow approved relative image paths in existing home template
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null
          ssh-keyscan -T 10 -H "$SAKURA_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" 'sh -s' <<'REMOTE'
          set -eu
          D=/home/rakudadou/hope-blog-private/data
          T=$(mktemp -d "$D/eyecatch-listing.XXXXXXXX")
          trap 'rm -rf "$T"' EXIT
          cat > "$T/fix.php" <<'PHP'
          <?php
          declare(strict_types=1);
          $p='/home/rakudadou/hope-blog-private/data/home-page.php';
          if(!is_file($p)||is_link($p))throw new RuntimeException('Home template missing');
          $s=file_get_contents($p);
          $old=<<<'OLD'
          if(preg_match('~^https?://~i',$img)):?>
          OLD;
          $new=<<<'NEW'
          if(preg_match('~^https?://~i',$img)||preg_match('~^/hope-blog/assets/hope-blog-images/[a-f0-9]{48}\.(?:jpg|png|webp|gif)$~D',$img)):?>
          NEW;
          if(substr_count($s,$new)===1&&substr_count($s,$old)===0){echo 'Already fixed'.PHP_EOL;exit;}
          if(substr_count($s,$old)!==1)throw new RuntimeException('Unexpected template structure');
          $out=str_replace($old,$new,$s);
          $dir=dirname($p);$bak=tempnam($dir,'before-eyecatch-listing-');if(!$bak||!copy($p,$bak)||!chmod($bak,0600))throw new RuntimeException('Backup failed');
          $tmp=tempnam($dir,'home-stage-');if(!$tmp||file_put_contents($tmp,$out)!==strlen($out))throw new RuntimeException('Stage failed');
          chmod($tmp,fileperms($p)&0777);
          exec('php -l '.escapeshellarg($tmp),$log,$status);
          if($status!==0){unlink($tmp);throw new RuntimeException('PHP syntax validation failed');}
          if(!rename($tmp,$p)||file_get_contents($p)!==$out)throw new RuntimeException('Template replacement failed');
          echo 'PASS: only image eligibility condition changed; HTML, CSS and article data preserved.'.PHP_EOL;
          
          PHP
          php -l "$T/fix.php"
          php "$T/fix.php"
          REMOTE
      - name: Verify image on article and homepage
        run: |
          set -eu
          curl -fsSL --max-time 30 'https://rakudadou.sakura.ne.jp/hope-blog/blog-entry-122.html' -o /tmp/article.html
          curl -fsSL --max-time 30 'https://rakudadou.sakura.ne.jp/hope-blog/' -o /tmp/home.html
          python - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__();self.img=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='img': self.img.append(dict(attrs))
          a=P();a.feed(open('/tmp/article.html').read())
          h=P();h.feed(open('/tmp/home.html').read())
          target='/hope-blog/assets/hope-blog-images/17fa18a55d219610336ad081547a75caca58099ea11ce122.png'
          assert any(x.get('src','')==target and x.get('alt') for x in a.img)
          assert any(x.get('src','')==target and x.get('alt') for x in h.img)
          print('PASS: article and homepage both include cover with alt.')
          PY
          curl -fsSL --max-time 30 'https://rakudadou.sakura.ne.jp/hope-blog/assets/hope-blog-images/17fa18a55d219610336ad081547a75caca58099ea11ce122.png' -o /tmp/cover.png
          test "$(git hash-object /tmp/cover.png)" = '17fa18a55d219610336ad081547a75caca58099e'
          echo 'PASS: public image matches original.'
