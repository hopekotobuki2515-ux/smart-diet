name: EQUINERIS Sakura SSH connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: sakura-production
    timeout-minutes: 5
    steps:
      - name: Validate configuration
        env:
          HOST: ${{ vars.SAKURA_HOST }}
          USER: ${{ vars.SAKURA_USER }}
          PORT: ${{ vars.SAKURA_PORT }}
          KEY: ${{ secrets.SAKURA_SSH_KEY }}
          HOST_KEY: ${{ secrets.SAKURA_HOST_KEY }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$PORT"
          test -n "$KEY" && test -n "$HOST_KEY"
          case "$PORT" in *[!0-9]*|'') exit 1;; esac
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$PORT" "$USER@$HOST" 'printf "SSH connection successful\n"'
