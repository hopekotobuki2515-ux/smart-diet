            const v=await p.evaluate(()=>({title:document.title,scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,robots:document.querySelector('meta[name=robots]')?.content||'',description:document.querySelector('meta[name=description]')?.content||''}));
            console.log('LAYOUT '+JSON.stringify({width,...v}));
            if(r.status()!==200||v.scroll>v.client+2||!v.title.includes('加圧トレーニングで美肌は期待できる？')||!v.description.includes('加圧トレーニングと美肌の関係'))throw Error('Layout or metadata mismatch');
            await p.close();
          }}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
