          curl -fsSL --max-time 30 "$URL" -o /tmp/hope-new.html
          grep -Fq '加圧トレーニングと肌の関係' /tmp/hope-new.html
          grep -Fq '最終的に56人のデータが分析されました' /tmp/hope-new.html
          grep -Fq '/hope-blog/blog-entry-102.html' /tmp/hope-new.html
          curl -fsSL --max-time 30 'https://rakudadou.sakura.ne.jp/hope-blog/' -o /tmp/hope-home.html
