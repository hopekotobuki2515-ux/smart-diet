              const res=await p.goto('https://rakudadou.sakura.ne.jp/hope-blog/blog-entry-'+process.env.ARTICLE_ID+'.html',{waitUntil:'domcontentloaded',timeout:30000});
              if(res.status()!==200)throw Error('HTTP '+res.status());
              const v=await p.evaluate(()=>({title:document.title,desc:document.querySelector('meta[name=description]')?.content||'',viewport:document.querySelector('meta[name=viewport]')?.content||'',scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,link:!!document.querySelector('a[href="/hope-blog/blog-entry-102.html"]'),research:document.body.innerText.includes('最終的に56人のデータが分析されました'),robots:document.querySelector('meta[name=robots]')?.content||'',canonical:document.querySelector('link[rel=canonical]')?.href||''}));
              console.log('LAYOUT '+JSON.stringify({width,...v}));
              if(!v.title.includes('加圧トレーニングと肌の関係')||!v.desc.includes('肌の調子が良くなった')||!v.link||!v.research||v.scroll>v.client+2)throw Error('Article layout or metadata mismatch');
              await p.close();
