name: Publish uploaded Google site verification file
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-hope-search-console-verification.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install exact uploaded verification bytes without overwriting other files
        env:
          SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_HOST: ${{ vars.SAKURA_HOST }}
          SAKURA_USER: ${{ vars.SAKURA_USER }}
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%b\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_sakura
          ssh-keygen -y -f ~/.ssh/id_sakura >/dev/null
          ssh-keyscan -T 10 -H "$SAKURA_HOST" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_sakura -o BatchMode=yes -o StrictHostKeyChecking=yes "$SAKURA_USER@$SAKURA_HOST" 'sh -s' <<'REMOTE'
          set -eu
          cd /home/rakudadou/www
          f=google09970eca0f74e2bc.html
          T=$(mktemp /home/rakudadou/hope-gsc.XXXXXXXX)
          trap 'rm -f "$T"' EXIT
          printf '%s' 'google-site-verification: google09970eca0f74e2bc.html' > "$T"
          test "$(sha256 -q "$T")" = 39303dfd78e570f2d45a3b600184e7abd6347d08f31fae6f78e8d989b4c3e5df
          test ! -L "$f"
          if test -e "$f"; then
            cmp -s "$f" "$T" || { echo 'Existing file differs; not overwritten'; exit 1; }
          else
            chmod 644 "$T"
            (set -C; cat "$T" > "$f")
            chmod 644 "$f"
          fi
          cmp -s "$T" "$f"
          echo 'PASS exact Google verification file installed or already present.'
          REMOTE
      - name: Confirm direct HTTPS response and byte identity
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen,Request
          from hashlib import sha256
          u='https://www.rakudadou.jp/google09970eca0f74e2bc.html'
          for ua in ['Mozilla/5.0','Googlebot','Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) Mobile/15E148']:
              with urlopen(Request(u,headers={'User-Agent':ua}),timeout=20) as r:
                  assert r.status==200 and r.geturl()==u,(r.status,r.geturl())
                  assert sha256(r.read()).hexdigest()=='39303dfd78e570f2d45a3b600184e7abd6347d08f31fae6f78e8d989b4c3e5df'
                  print('PASS HTTP 200; exact uploaded bytes; no redirect:',ua)
          PY
