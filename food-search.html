<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f8f2">
<meta name="robots" content="noindex">
<title>食品マスター検索｜SMART Diet</title>
<link rel="stylesheet" href="./program.css?v=20261120-15">
<style>
.food-search-main{padding-bottom:44px}
.food-search-help{font-size:13px;color:#64728a}
.food-search-filters{display:grid;grid-template-columns:1fr;gap:2px}
.food-search-filters label{margin-top:10px}
.food-search-summary{font-size:14px;color:#286d4f;font-weight:700;min-height:1.5em}
.food-search-summary.error{color:#ac3e25}
.food-result{margin-bottom:10px;padding:17px}
.food-result h2{font-size:17px;margin:0 0 6px;overflow-wrap:anywhere}
.food-result-meta{color:#64728a;font-size:13px;margin:0 0 10px;overflow-wrap:anywhere}
.food-result-amount{color:#286d4f;font-size:17px;margin:5px 0 8px;font-weight:800}
.food-result label{margin:6px 0;font-size:13px}
.food-result input{margin-top:5px}
.food-result-output{background:#f3f7ef;padding:10px 12px;border-radius:11px;min-height:42px;font-size:14px;margin:8px 0 0}
.food-result-output strong{color:#286d4f}
.food-search-pages{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.food-search-pages button{border:1px solid #b6d5bf;background:#fff;border-radius:12px;color:#286d4f;padding:12px 15px;min-height:44px;font:inherit;font-weight:700}
.food-search-pages button:disabled{opacity:.35}
.food-search-pages span{font-size:13px;color:#64728a}
.food-search-pages[hidden]{display:none}
.food-result input:focus-visible,.food-search-filters input:focus-visible,.food-search-filters select:focus-visible,.food-search-pages button:focus-visible{outline:3px solid #d9a75b;outline-offset:2px}
@media(max-width:370px){.food-result{padding:14px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><a href="./program.html" aria-label="SMART Dietに戻る">‹</a><strong>SM<span>A</span>RT <em>Diet</em></strong><small>食品検索</small></header>
<main class="food-search-main">
<section class="card">
<span class="eyebrow">1点＝80kcal</span>
<h1>食品マスター検索</h1>
<p>食品名・ひらがな・カタカナ・主要食品の英語名、または1点分の重量（例：50g）から食品を検索できます。食べた量を入力すると点数も計算します。</p>
<div class="food-search-filters">
<label for="keyword">食品名・ひらがな・英語・1点分の重量で検索
<input id="keyword" type="search" placeholder="例：たまご、egg、50g" autocomplete="off" spellcheck="false">
</label>
<label for="group">食品グループ
<select id="group">
<option value="">すべての食品群</option>
<option value="第1群">第1群</option>
<option value="第2群">第2群</option>
<option value="第3群">第3群</option>
<option value="第4群">第4群</option>
</select></label>
</div>
<p id="status" class="food-search-summary" role="status" aria-live="polite">食品マスターを読み込んでいます。</p>
</section>
<div id="results" aria-label="検索結果"></div>
<div id="pages" class="food-search-pages" hidden>
<button id="previous" type="button">前へ</button>
<span id="pageText"></span>
<button id="next" type="button">次へ</button>
</div>
<p class="food-search-help">重量と点数は食品マスターの値を用いた目安です。調理法や食品の違いにより実際のエネルギー量は変わります。この画面では食事の記録は保存されません。</p>
</main>
</div>
<script type="module">
'use strict';
const aliasGroups=[{"terms":["ごはん","ご飯","白ごはん","白ご飯","らいす","rice","gohan"],"targets":["めし・水稲","米・水稲穀粒","赤飯"]},{"terms":["たまご","玉子","えっぐ","egg","eggs","tamago"],"targets":["鶏卵","うずら卵","卵豆腐","ピータン"]},{"terms":["ぎゅうにゅう","みるく","milk","gyunyu"],"targets":["牛乳","加工乳","生乳","乳飲料"]},{"terms":["よーぐると","yogurt","yoghurt"],"targets":["ヨーグルト"]},{"terms":["ちーず","cheese"],"targets":["チーズ"]},{"terms":["とうふ","tofu"],"targets":["豆腐"]},{"terms":["なっとう","natto","nattou"],"targets":["納豆"]},{"terms":["ぱん","bread","pan"],"targets":["パン","クロワッサン","マフィン","デニッシュ","ナン","ピザクラスト"]},{"terms":["さかな","おさかな","fish","seafood"],"targets":["魚介類"]},{"terms":["まぐろ","tuna","maguro"],"targets":["マグロ"]},{"terms":["しゃけ","さーもん","salmon"],"targets":["サケ","サーモン","マスノスケ"]},{"terms":["えび","shrimp","prawn"],"targets":["エビ","えび"]},{"terms":["いか","squid"],"targets":["イカ","いか"]},{"terms":["たこ","octopus"],"targets":["タコ","たこ"]},{"terms":["ぎゅうにく","beef"],"targets":["肉類・牛肉"]},{"terms":["ぶたにく","pork"],"targets":["肉類・豚肉"]},{"terms":["とりにく","chicken"],"targets":["肉類・鶏肉"]},{"terms":["おにく","にく","meat"],"targets":["肉類"]},{"terms":["やさい","vegetable","vegetables","veggie"],"targets":["野菜"]},{"terms":["くだもの","ふるーつ","fruit","fruits"],"targets":["果物"]},{"terms":["ばなな","banana"],"targets":["バナナ"]},{"terms":["りんご","apple","apples"],"targets":["りんご"]},{"terms":["みかん","orange","mandarin"],"targets":["みかん"]},{"terms":["いちご","strawberry","strawberries"],"targets":["いちご"]},{"terms":["ぶどう","grape","grapes"],"targets":["ぶどう"]},{"terms":["にんじん","carrot","carrots"],"targets":["にんじん"]},{"terms":["じゃがいも","ぽてと","potato","potatoes"],"targets":["じゃが芋","ポテト"]},{"terms":["さつまいも","sweetpotato","sweet potato"],"targets":["さつま芋"]},{"terms":["かぼちゃ","pumpkin","squash"],"targets":["かぼちゃ"]},{"terms":["きゅうり","cucumber"],"targets":["きゅうり"]},{"terms":["とまと","tomato"],"targets":["トマト"]},{"terms":["なすび","eggplant","aubergine"],"targets":["なす"]},{"terms":["きのこ","mushroom","mushrooms"],"targets":["きのこ","しいたけ","しめじ","まいたけ","エリンギ","マッシュルーム","なめこ","えのきたけ","ひらたけ"]},{"terms":["こーひー","coffee"],"targets":["コーヒー"]},{"terms":["ここあ","cocoa"],"targets":["ココア"]},{"terms":["ちょこれーと","chocolate"],"targets":["チョコレート","チョココロネ"]},{"terms":["あいす","icecream","ice cream"],"targets":["アイスクリーム","ラクトアイス","アイスミルク"]},{"terms":["ばたー","butter"],"targets":["バター"]},{"terms":["あぶら","おいる","oil"],"targets":["油","オイル"]},{"terms":["さとう","sugar"],"targets":["砂糖"]},{"terms":["みそ","miso"],"targets":["みそ"]},{"terms":["しょうゆ","soy sauce","soysauce"],"targets":["しょうゆ"]},{"terms":["うどん","udon"],"targets":["うどん"]},{"terms":["そば","soba"],"targets":["そば"]},{"terms":["すぱげってぃ","すぱげてぃ","ぱすた","spaghetti","pasta"],"targets":["スパゲッティ","マカロニ"]},{"terms":["びーる","beer"],"targets":["ビール"]},{"terms":["わいん","wine"],"targets":["ワイン"]}];
function normalizeText(value) {
 return String(value??'').normalize('NFKC').toLocaleLowerCase('ja')
  .replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
  .replace(/[\s・･]/g,'');
}
function parseOnePointGrams(value) {
 const normalized=String(value??'').normalize('NFKC').replace(/\s+/g,'').trim();
 const match=normalized.match(/^(\d+(?:\.\d+)?)$/)
   || normalized.match(/^(?:食品)?(\d+(?:\.\d+)?)(?:g|grams?|グラム)(?:(?:=|は|で)?1点)?(?:の?食材)?$/i);
 if(!match)return null;
 const grams=Number(match[1]);
 return Number.isFinite(grams)&&grams>0&&grams<=10000?grams:null;
}
function filterFoodRecords(records,rawQuery,group) {
 const onePointGrams=parseOnePointGrams(rawQuery);
 if(onePointGrams!==null)return records.filter(food=>(!group||food.group===group)&&food.gramsPerPoint===onePointGrams);
 const q=normalizeText(rawQuery);
 const exact=aliasGroups.filter(item=>item.terms.some(term=>normalizeText(term)===q));
 const possible=exact.length?exact:q.length>=2?aliasGroups.filter(item=>item.terms.some(term=>normalizeText(term).startsWith(q))):[];
 const targets=[...new Set(possible.flatMap(item=>item.targets.map(normalizeText)))];
 const matches=records.filter(food=>{
  if(group&&food.group!==group)return false;
  if(!q)return true;
  const name=normalizeText(food.name),category=normalizeText(food.category),grp=normalizeText(food.group);
  return name.includes(q)||category.includes(q)||grp.includes(q)
    ||targets.some(target=>name.includes(target)||category.includes(target));
 });
 if(!q)return matches;
 return matches.sort((a,b)=>{
  const rank=food=>{
   const name=normalizeText(food.name);
   return name===q?0:name.startsWith(q)?1:targets.some(target=>name===target)?2:3;
  };
  return rank(a)-rank(b);
 });
}
function calculateFoodPoints(grams, gramsPerPoint) {
  if (!Number.isFinite(grams)||grams<=0||grams>10000||!Number.isFinite(gramsPerPoint)||gramsPerPoint<=0) return null;
  const points=grams/gramsPerPoint;
  return {points, calories:points*80};
}
const keyword=document.getElementById('keyword');
const group=document.getElementById('group');
const status=document.getElementById('status');
const results=document.getElementById('results');
const pages=document.getElementById('pages');
const previous=document.getElementById('previous');
const next=document.getElementById('next');
const pageText=document.getElementById('pageText');
const perPage=20;
let foods=[],matches=[],page=0;
function make(tag,className,textValue){
  const element=document.createElement(tag);
  if(className)element.className=className;
  if(textValue!==undefined)element.textContent=textValue;
  return element;
}
function render(){
  matches=filterFoodRecords(foods,keyword.value,group.value);
  const total=matches.length;
  const totalPages=Math.max(1,Math.ceil(total/perPage));
  page=Math.min(page,totalPages-1);
  const start=page*perPage;
  const shown=matches.slice(start,start+perPage);
  status.classList.remove('error');
  const onePointGrams=parseOnePointGrams(keyword.value);
  status.textContent=total?total+'件見つかりました（'+(start+1)+'〜'+Math.min(start+perPage,total)+'件を表示）':onePointGrams!==null?'1点＝'+onePointGrams+'gに完全一致する食品は登録されていません。':'一致する食品がありません。検索語や食品群を変えてください。';
  const fragment=document.createDocumentFragment();
  shown.forEach((food,index)=>{
    const card=make('article','card food-result');
    const title=make('h2','',food.name);
    const meta=make('p','food-result-meta',food.group+' / '+food.category);
    const amount=make('p','food-result-amount','1点（80kcal）＝'+food.gramsPerPoint+'g');
    const label=make('label','','食べた量（g）');
    const input=make('input');
    input.type='number';input.inputMode='decimal';input.min='0.1';input.max='10000';input.step='0.1';
    input.placeholder='例：120';input.id='food-grams-'+index;
    label.htmlFor=input.id;label.append(input);
    const output=make('p','food-result-output','量を入力すると点数が表示されます。');
    output.setAttribute('aria-live','polite');
    input.addEventListener('input',()=>{
      if(input.value===''){output.textContent='量を入力すると点数が表示されます。';return;}
      const value=calculateFoodPoints(Number(input.value),Number(food.gramsPerPoint));
      if(!value){output.textContent='0より大きく、10000g以下の重量を入力してください。';return;}
      output.replaceChildren(make('strong','','約'+value.points.toFixed(2)+'点'),document.createTextNode(' ／ 約'+Math.round(value.calories)+'kcal'));
    });
    card.append(title,meta,amount,label,output);
    fragment.append(card);
  });
  results.replaceChildren(fragment);
  pages.hidden=total<=perPage;
  previous.disabled=page===0;
  next.disabled=page>=totalPages-1;
  pageText.textContent=(page+1)+' / '+totalPages+'ページ';
}
function refresh(){page=0;render();}
keyword.addEventListener('input',event=>{if(!event.isComposing)refresh();});
keyword.addEventListener('compositionend',refresh);
keyword.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing)event.preventDefault();});
group.addEventListener('change',refresh);
previous.addEventListener('click',()=>{if(page>0){page--;render();}});
next.addEventListener('click',()=>{if((page+1)*perPage<matches.length){page++;render();}});
fetch('./food-master.json',{cache:'no-store'})
  .then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json();})
  .then(data=>{
    if(!Array.isArray(data.foods)||!data.foods.length||!data.foods.every(f=>f&&typeof f.name==='string'&&typeof f.group==='string'&&typeof f.category==='string'&&Number.isFinite(f.gramsPerPoint)&&f.gramsPerPoint>0))throw new Error('invalid food master');
    foods=data.foods;
    render();
  })
  .catch(()=>{status.classList.add('error');status.textContent='食品マスターを読み込めませんでした。通信状況を確認してページを再読み込みしてください。';results.replaceChildren();pages.hidden=true;});
</script>
</body>
</html>
